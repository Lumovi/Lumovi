# External Secrets (https://external-secrets.io): secrets kept in sync with a vault or cloud store.
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: external-secrets
spec:
  version: 1.0.0
  needs:
    lumovi: 1.22.0
  groups:
    - external-secrets.io
  label: External Secrets
  icon: key-round
  kinds:
    - { group: external-secrets.io, kind: ExternalSecret }
    - { group: external-secrets.io, kind: ClusterExternalSecret }
    - { group: external-secrets.io, kind: SecretStore }
    - { group: external-secrets.io, kind: ClusterSecretStore }
    - { group: external-secrets.io, kind: PushSecret }
  views:
    - name: external-secrets
      kinds:
        - { group: external-secrets.io, kind: ExternalSecret }
      icon: lock
      columns:
        - { name: Store, path: .spec.secretStoreRef.name }
        - { name: Every, path: .spec.refreshInterval, default: 1h }
        - { name: Synced, path: .status.refreshTime, type: date }
      status:
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'True' }
          health: healthy
          label: Synced
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'False' }
          health: critical
          label: '{{ .status.conditions[?(@.type=="Ready")].reason ?? "Not synced" }}'
          detail: '{{ .status.conditions[?(@.type=="Ready")].message }}'
      details:
        - { name: Target secret, path: .spec.target.name, default: same as its name }
        - { name: Keys, path: '.spec.data[*].secretKey' }
        - { name: Synced revision, path: .status.syncedResourceVersion }
      links:
        - name: Secret
          kind: Secret
          objectName: '{{ .spec.target.name ?? .metadata.name }}'
        - name: Store
          kind: '{{ .spec.secretStoreRef.kind ?? "SecretStore" }}.external-secrets.io'
          objectName: '{{ .spec.secretStoreRef.name }}'
      actions:
        - name: Sync now
          runs: at-once
          icon: refresh-cw
          primary: true
          patch:
            metadata:
              annotations: { force-sync: '{{ now }}' }
          done: Asked External Secrets to sync {{ .metadata.name }}
    - name: external-secrets-stores
      kinds:
        - { group: external-secrets.io, kind: SecretStore }
        - { group: external-secrets.io, kind: ClusterSecretStore }
      icon: key-round
      columns:
        - { name: Capabilities, path: .status.capabilities }
      status:
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'True' }
          health: healthy
          label: Valid
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'False' }
          health: critical
          label: '{{ .status.conditions[?(@.type=="Ready")].reason ?? "Invalid" }}'
          detail: '{{ .status.conditions[?(@.type=="Ready")].message }}'
