# Traefik (https://traefik.io): its routes, and what they pass requests through.
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: traefik
spec:
  version: 1.0.0
  needs:
    lumovi: 1.22.0
  groups:
    - traefik.io
  label: Traefik
  icon: signpost
  category: network
  kinds:
    - { group: traefik.io, kind: IngressRoute }
    - { group: traefik.io, kind: Middleware }
    - { group: traefik.io, kind: IngressRouteTCP }
    - { group: traefik.io, kind: IngressRouteUDP }
    - { group: traefik.io, kind: MiddlewareTCP }
    - { group: traefik.io, kind: TraefikService }
    - { group: traefik.io, kind: TLSOption }
    - { group: traefik.io, kind: ServersTransport }
  views:
    - name: traefik-routes
      kinds:
        - { group: traefik.io, kind: IngressRoute }
        - { group: traefik.io, kind: IngressRouteTCP }
        - { group: traefik.io, kind: IngressRouteUDP }
      icon: route
      columns:
        - { name: Entry points, path: '.spec.entryPoints[*]' }
        - { name: Rules, path: '.spec.routes[*].match' }
        - { name: Services, path: '.spec.routes[*].services[*].name' }
        - { name: TLS secret, path: .spec.tls.secretName }
      details:
        - { name: Entry points, path: '.spec.entryPoints[*]' }
        - { name: Rules, path: '.spec.routes[*].match' }
        - { name: Services, path: '.spec.routes[*].services[*].name' }
        - { name: Middlewares, path: '.spec.routes[*].middlewares[*].name' }
        - { name: TLS secret, path: .spec.tls.secretName }
        - { name: Certificate resolver, path: .spec.tls.certResolver }
      links:
        - name: TLS secret
          kind: Secret
          objectName: '{{ .spec.tls.secretName }}'
        - name: Service
          kind: Service
          objectName: '{{ .spec.routes[0].services[0].name }}'
    - name: traefik-middlewares
      kinds:
        - { group: traefik.io, kind: Middleware }
        - { group: traefik.io, kind: MiddlewareTCP }
      icon: layers
      details:
        - { name: Redirects to, path: .spec.redirectScheme.scheme }
        - { name: Strips prefixes, path: '.spec.stripPrefix.prefixes[*]' }
        - { name: Rate, path: .spec.rateLimit.average, type: number }
        - { name: Allowed sources, path: '.spec.ipAllowList.sourceRange[*]' }
        - { name: Forwards auth to, path: .spec.forwardAuth.address }
        - { name: Chains, path: '.spec.chain.middlewares[*].name' }
