# KubeVirt (https://kubevirt.io): virtual machines, their running instances and migrations,
# and the disks CDI imports for them.
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: kubevirt
spec:
  version: 1.0.0
  needs:
    lumovi: 1.22.0
  groups:
    - kubevirt.io
    - cdi.kubevirt.io
  label: KubeVirt
  icon: server
  kinds:
    - { group: kubevirt.io, kind: VirtualMachine }
    - { group: kubevirt.io, kind: VirtualMachineInstance }
    - { group: kubevirt.io, kind: VirtualMachineInstanceMigration }
    - { group: cdi.kubevirt.io, kind: DataVolume }
    - { group: cdi.kubevirt.io, kind: DataSource }
  views:
    - name: kubevirt-virtual-machines
      kinds:
        - { group: kubevirt.io, kind: VirtualMachine }
      icon: server
      columns:
        - { name: Run strategy, path: .spec.runStrategy }
        - { name: CPU cores, path: .spec.template.spec.domain.cpu.cores, type: number }
        - { name: Memory, path: .spec.template.spec.domain.memory.guest }
        - { name: Ready, path: .status.ready, type: boolean, default: 'No' }
      status:
        - when: { path: .status.printableStatus, equals: Running }
          health: healthy
          label: Running
        - when: { path: .status.printableStatus, in: [Stopped, Paused] }
          health: neutral
          label: '{{ .status.printableStatus }}'
        - when: { path: .status.printableStatus, matches: '^Err|Error|CrashLoop|Unschedulable' }
          health: critical
          label: '{{ .status.printableStatus }}'
          detail: '{{ .status.conditions[?(@.type=="Failure")].message }}'
        - health: progressing
          label: '{{ .status.printableStatus ?? "Provisioning" }}'
      details:
        - { name: Run strategy, path: .spec.runStrategy }
        - { name: CPU cores, path: .spec.template.spec.domain.cpu.cores, type: number }
        - { name: Memory, path: .spec.template.spec.domain.memory.guest }
        - { name: Disks, path: '.spec.template.spec.domain.devices.disks[*].name' }
        - { name: Instance type, path: .spec.instancetype.name }
        - { name: Preference, path: .spec.preference.name }
      links:
        - name: Instance
          kind: VirtualMachineInstance.kubevirt.io
          objectName: '{{ .metadata.name }}'
      related:
        - name: Pods
          kind: Pod
          labels: { vm.kubevirt.io/name: '{{ .metadata.name }}' }
      actions:
        - name: Start
          runs: at-once
          icon: play
          primary: true
          when: { path: .status.printableStatus, equals: Stopped }
          patch: { spec: { runStrategy: Always, running: null } }
          undo: { spec: { runStrategy: Halted } }
          done: Starting {{ .metadata.name }}
        - name: Stop
          danger: true
          when: { path: .status.printableStatus, notEquals: Stopped }
          confirm: Its guest is shut down, and it stays stopped until it's started again.
          patch: { spec: { runStrategy: Halted, running: null } }
          undo: { spec: { runStrategy: Always } }
          done: Stopping {{ .metadata.name }}
    - name: kubevirt-instances
      kinds:
        - { group: kubevirt.io, kind: VirtualMachineInstance }
      icon: server
      columns:
        - { name: Node, path: .status.nodeName }
        - { name: IP, path: '.status.interfaces[0].ipAddress' }
        - { name: OS, path: .status.guestOSInfo.prettyName }
      status:
        - when: { path: .status.phase, equals: Running }
          health: healthy
          label: Running
        - when: { path: .status.phase, equals: Failed }
          health: critical
          label: Failed
          detail: '{{ .status.reason }}'
        - when: { path: .status.phase, equals: Succeeded }
          health: neutral
          label: Shut down
        - health: progressing
          label: '{{ .status.phase ?? "Pending" }}'
      details:
        - { name: Node, path: .status.nodeName }
        - { name: IPs, path: '.status.interfaces[*].ipAddresses[*]' }
        - { name: OS, path: .status.guestOSInfo.prettyName }
        - { name: Kernel, path: .status.guestOSInfo.kernelRelease }
        - { name: Migration, path: .status.migrationMethod }
      links:
        - name: Virtual machine
          kind: VirtualMachine.kubevirt.io
          objectName: '{{ .metadata.name }}'
        - name: Node
          kind: Node
          objectName: '{{ .status.nodeName }}'
      related:
        - name: Pods
          kind: Pod
          labels: { kubevirt.io/created-by: '{{ .metadata.uid }}' }
    - name: kubevirt-migrations
      kinds:
        - { group: kubevirt.io, kind: VirtualMachineInstanceMigration }
      icon: route
      columns:
        - { name: Instance, path: .spec.vmiName }
      status:
        - when: { path: .status.phase, equals: Succeeded }
          health: healthy
          label: Migrated
        - when: { path: .status.phase, equals: Failed }
          health: critical
          label: Failed
        - health: progressing
          label: '{{ .status.phase ?? "Pending" }}'
      links:
        - name: Instance
          kind: VirtualMachineInstance.kubevirt.io
          objectName: '{{ .spec.vmiName }}'
    - name: kubevirt-data-volumes
      kinds:
        - { group: cdi.kubevirt.io, kind: DataVolume }
      icon: database
      columns:
        - { name: Progress, path: .status.progress }
        - { name: From, path: .spec.source.http.url }
        - { name: Image, path: .spec.source.registry.url }
        - { name: Claim, path: .status.claimName }
      status:
        - when: { path: .status.phase, equals: Succeeded }
          health: healthy
          label: Ready
        - when: { path: .status.phase, equals: Failed }
          health: critical
          label: Failed
          detail: '{{ .status.conditions[?(@.type=="Running")].message }}'
        - health: progressing
          label: '{{ .status.phase ?? "Pending" }}'
          detail: '{{ .status.progress }}'
      links:
        - name: Claim
          kind: PersistentVolumeClaim
          objectName: '{{ .status.claimName ?? .metadata.name }}'
    - name: kubevirt-data-sources
      kinds:
        - { group: cdi.kubevirt.io, kind: DataSource }
      icon: archive
      columns:
        - { name: Claim, path: .spec.source.pvc.name }
        - { name: Snapshot, path: .spec.source.snapshot.name }
      status:
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'True' }
          health: healthy
          label: Ready
        - when: { path: '.status.conditions[?(@.type=="Ready")].status', equals: 'False' }
          health: warning
          label: Not ready
          detail: '{{ .status.conditions[?(@.type=="Ready")].message }}'
