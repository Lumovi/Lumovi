# Packaging for macOS, Windows and Linux. See https://www.electron.build/configuration
appId: io.github.kotapeter.kubestacks
productName: KubeStacks
copyright: Copyright © 2026 KubeStacks contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - '!out/**/*.map'
  - '!out/THIRD_PARTY_NOTICES.txt'
  - package.json

# Next to the app, where people (and package tools) can find them.
extraResources:
  - LICENSE
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# Turn off what only a debugger or another program would use to run code as the app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Flipping fuses breaks the ad-hoc signature unsigned builds run with on Apple silicon.
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  # Signed when CSC_LINK is set, and notarized when APPLE_API_KEY, _KEY_ID and _ISSUER are too.

dmg:
  writeUpdateInfo: false

win:
  # Edge to edge, as Windows icons are (macOS and Linux use build/icon.png).
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # One installer for x64 and arm64, which installs the one the computer needs.
  artifactName: ${productName}-${version}-win.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  executableName: kubestacks
  category: Development
  synopsis: A beautiful, fast Kubernetes app for the desktop
  maintainer: Peter Kota <kotapeter@gmail.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

publish:
  provider: github
  owner: kotapeter
  repo: kubestacks
  releaseType: draft
