# Packaging for macOS, Windows and Linux. See https://www.electron.build/configuration
appId: dev.lumovi.app
productName: Lumovi
copyright: Copyright © 2026 Lumovi contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  # The installers' artwork is found in build/ by name: background.png (and its @2x) for the
  # macOS disk image, installerSidebar.bmp and installerHeader.bmp for the Windows installer.
  buildResources: build
  output: release

files:
  - out/**/*
  - '!out/**/*.map'
  - '!out/THIRD_PARTY_NOTICES.txt'
  # The server, for running Lumovi in a cluster (see Dockerfile), isn't the app's.
  - '!out/server/**'
  - package.json

# Next to the app, where people (and package tools) can find them.
extraResources:
  - LICENSE
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# Turn off what only a debugger or another program would use to run code as the app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Flipping fuses breaks the ad-hoc signature unsigned builds run with on Apple silicon.
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The Liquid Glass icon, compiled by Xcode's actool (Xcode 26 or later on the Mac that
  # builds) along with the .icns older versions of macOS show.
  icon: build/Lumovi.icon
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  # Signed when CSC_LINK is set, and notarized when APPLE_API_KEY, _KEY_ID and _ISSUER are too.

dmg:
  writeUpdateInfo: false

win:
  # Edge to edge, as Windows icons are.
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # One installer for x64 and arm64, which installs the one the computer needs.
  artifactName: ${productName}-${version}-win.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  executableName: lumovi
  category: Development
  synopsis: A beautiful, fast Kubernetes dashboard for the desktop
  # Drawn for each size.
  icon: build/icons
  maintainer: Peter Kota <kotapeter@gmail.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

publish:
  provider: github
  owner: Lumovi
  repo: Lumovi
  releaseType: draft
