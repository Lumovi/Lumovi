# Packaging for macOS, Windows and Linux. See https://www.electron.build/configuration
appId: dev.lumovi.app
productName: Lumovi
copyright: Copyright © 2026 Lumovi contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  # The installers' artwork is found in build/ by name: background.png (and its @2x) for the
  # macOS disk image, installerSidebar.bmp and installerHeader.bmp for the Windows installer.
  buildResources: build
  output: release

files:
  - out/**/*
  - '!out/**/*.map'
  - '!out/THIRD_PARTY_NOTICES.txt'
  # The server, for running Lumovi in a cluster (see Dockerfile), isn't the app's.
  - '!out/server/**'
  # Nor is a fleet's agent.
  - '!out/agent/**'
  - package.json
  # node-pty's sources: only its binaries (and its JavaScript) run.
  - '!node_modules/node-pty/{src,deps,scripts,third_party}/**'
  - '!node_modules/node-pty/{binding.gyp,*.md}'

# node-pty, for terminals on this computer: its binaries run outside the archive (one is a
# program of its own). They're N-API, so they need no rebuilding for Electron, and each
# platform's are its own: prebuilt for macOS and Windows (both architectures), built for Linux
# when it's installed (on the architecture it's for).
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
  # The stdio bridge AI assistants start on Windows, run as Node (see scripts/after-pack.mjs).
  - out/mcp-stdio/**

# Next to the app, where people (and package tools) can find them.
extraResources:
  - LICENSE
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # helm, which Lumovi's Helm actions run (and its license): scripts/before-pack.mjs puts the
  # platform's and architecture's there.
  - from: build/helm/${platform}-${arch}
    to: helm

# Turn off what only a debugger or another program would use to run code as the app. Running it
# as Node is each platform's own (scripts/after-pack.mjs): off, except on Windows.
beforePack: scripts/before-pack.mjs
afterPack: scripts/after-pack.mjs
electronFuses:
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Flipping fuses breaks the ad-hoc signature unsigned builds run with on Apple silicon.
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The Liquid Glass icon, compiled by Xcode's actool (Xcode 26 or later on the Mac that
  # builds) along with the .icns older versions of macOS show.
  icon: build/Lumovi.icon
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  files:
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  # Signed when CSC_LINK is set, and notarized when APPLE_API_KEY, _KEY_ID and _ISSUER are too.

dmg:
  writeUpdateInfo: false

win:
  # Edge to edge, as Windows icons are.
  icon: build/icon-win.png
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
  target:
    - target: nsis
      arch: [x64, arm64]
  # Signed by the release (release.yml gives it the certificate): its libraries too, which Smart
  # App Control runs only signed, with SHA-256 alone, timestamped so the signatures outlive the
  # certificate.
  signExts: [.dll, .node]
  signtoolOptions:
    # The certificate's name (its CN). Installed versions take only updates signed by it.
    publisherName: Open Source Developer Péter Kóta
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://time.certum.pl

nsis:
  # One installer for x64 and arm64, which installs the one the computer needs.
  artifactName: ${productName}-${version}-win.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# The Microsoft Store's package (npx electron-builder --win appx): Microsoft signs it, and the
# Store updates it. Its identity is the Store's (Partner Center → Product identity); its images
# are build/appx/ (Lumovi-design's icons/app/windows/store/), and its manifest
# build/appxmanifest.xml.
appx:
  identityName: PeterKota.Lumovi
  publisher: CN=1A1E4958-8136-4D23-A653-58BADF043EA0
  publisherDisplayName: Peter Kota
  applicationId: Lumovi
  displayName: Lumovi
  backgroundColor: transparent
  languages: [en-US]
  # What it writes to AppData isn't redirected (see the manifest): Windows 10 2004 and later.
  capabilities: [runFullTrust, unvirtualizedResources]
  customManifestPath: appxmanifest.xml
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  artifactName: ${productName}-${version}-store-${arch}.${ext}

linux:
  executableName: lumovi
  category: Development
  synopsis: A calm, fast Kubernetes dashboard, on your desktop or in your cluster.
  # Drawn for each size.
  icon: build/icons
  maintainer: Peter Kota <kotapeter@gmail.com>
  # node-pty as built here, for this architecture (each is built on its own: see release.yml).
  files:
    - '!node_modules/node-pty/prebuilds/**'
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

publish:
  provider: github
  owner: Lumovi
  repo: Lumovi
  releaseType: draft
