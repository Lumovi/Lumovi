version: 2
# Weekly on Saturday, when nothing of ours is in CI's queue, and a few pull requests at a time:
# patch bumps together, each kind of minor bump with its own, and every major (and Electron) by
# itself, since those are the ones to read. Security updates don't wait for the day or a group.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 4
    ignore:
      # Types track the Node.js line the tooling runs on (see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # electron-vite supports Vite 7; move these together when it supports the next major.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript up to 6.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # (The first group a bump fits is its own: patches first.)
    groups:
      patches:
        applies-to: version-updates
        patterns: ['*']
        exclude-patterns: ['electron']
        update-types: ['patch']
      react:
        applies-to: version-updates
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: ['minor']
      build-tooling:
        applies-to: version-updates
        patterns:
          ['vite', 'electron-vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
        update-types: ['minor']
      lint:
        applies-to: version-updates
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'eslint-plugin-*',
            'prettier',
            'prettier-plugin-*',
            'globals',
          ]
        update-types: ['minor']
      ui:
        applies-to: version-updates
        patterns:
          [
            'radix-ui',
            'cmdk',
            'lucide-react',
            '@tanstack/*',
            'zustand',
            'react-router',
            '@fontsource-variable/*',
          ]
        update-types: ['minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 4
    groups:
      # Every step of github/codeql-action has to be one version: moved as one, whatever the bump.
      codeql:
        applies-to: version-updates
        patterns: ['github/codeql-action', 'github/codeql-action/*']
      # The other pins, minor and patch, in one pull request; a major by itself.
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
