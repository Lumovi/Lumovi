version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types track the Node.js line the tooling runs on (see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # electron-vite supports Vite 7; move these together when it supports the next major.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript up to 6.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build-tooling:
        patterns:
          ['vite', 'electron-vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'eslint-plugin-*',
            'prettier',
            'prettier-plugin-*',
            'globals',
          ]
      ui:
        patterns:
          [
            'radix-ui',
            'cmdk',
            'lucide-react',
            '@tanstack/*',
            'zustand',
            'react-router',
            '@fontsource-variable/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
