name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never sign during CI builds.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  checks:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Allow Chromium's sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces Electron's sandbox needs.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build with coverage instrumentation
        run: npm run build:coverage
      - name: Run e2e tests
        shell: bash
        env:
          # Nobody's watching: draw the windows, as transparent ones render slowly on Linux and Windows.
          KUBESTACKS_E2E_OPAQUE: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test
          else
            npx playwright test
          fi
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ runner.os }}
          path: .nyc_output/
          include-hidden-files: true
          retention-days: 7
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  coverage:
    name: Coverage (all platforms)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect coverage from every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .nyc_output
          merge-multiple: true
      - name: Report
        run: |
          npx nyc report --reporter=text --reporter=html --reporter=lcov --reporter=json-summary
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`
            console.log(["## E2E coverage (Linux + macOS + Windows)", "", "| | % | covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Require 100% coverage
        run: npm run coverage:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: release/linux-unpacked/kubestacks
          - os: macos-latest
            executable: release/mac-arm64/KubeStacks.app/Contents/MacOS/KubeStacks
          - os: windows-latest
            executable: release/win-unpacked/KubeStacks.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright drives the app through the Node.js inspector, which release builds turn off.
      # (In bash: PowerShell would split the -c.… argument.)
      - run: npx electron-builder --dir -c.electronFuses.enableNodeCliInspectArguments=true
        shell: bash
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test the packaged app
        shell: bash
        env:
          KUBESTACKS_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: |
          specs="tests/e2e/welcome.spec.ts tests/e2e/overview.spec.ts"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test $specs
          else
            npx playwright test $specs
          fi

  integration:
    name: Integration (kind)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # kind and kubectl only: cluster.ts creates the cluster, with its own kubeconfig.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.33.0
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build
      - name: Start the kind cluster, with metrics-server and Prometheus
        run: node tests/integration/cluster.ts up
      - name: Run the integration tests
        run: xvfb-run --auto-servernum npx playwright test -c playwright.integration.config.ts
      - name: Cluster state
        if: ${{ failure() }}
        run: |
          export KUBECONFIG=.kind/kubeconfig
          kubectl get nodes,pods --all-namespaces -o wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -60
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-integration
          path: |
            playwright-report-integration/
            test-results-integration/
          retention-days: 7
