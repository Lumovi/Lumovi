name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never sign during CI builds.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  checks:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Lumovi's views against the CRDs of the operators they're for (tests/views).
      - run: npm run views:check
      # The app ships the helm the server's image has (scripts/helm.ts, and the Dockerfile's).
      - name: One helm for the app and the image
        run: |
          version=$(node -e "import('./scripts/helm.ts').then((helm) => console.log(helm.HELM_VERSION))")
          grep -qx "ARG HELM_VERSION=$version" Dockerfile || {
            echo "::error file=Dockerfile::The image's helm isn't $version, the app's (scripts/helm.ts)."
            exit 1
          }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Helm chart
        run: |
          node scripts/chart-version.ts --check
          helm lint charts/lumovi --strict
          # Every way of signing in, with everything turned on.
          for mode in token oidc proxy; do
            helm template lumovi charts/lumovi --set auth.mode="$mode" \
              --set url=https://lumovi.example.com \
              --set auth.oidc.issuer=https://dex.example.com --set auth.oidc.clientId=lumovi \
              --set ingress.enabled=true --set networkPolicy.enabled=true \
              --set 'networkPolicy.from[0].podSelector.matchLabels.app=oauth2-proxy' >/dev/null
          done
          # Behind a proxy, only the proxy reaches Lumovi: without saying which pods it is, refused;
          # with them, a NetworkPolicy lets them alone in, whether networkPolicy.enabled says so.
          (! helm template lumovi charts/lumovi --set auth.mode=proxy 2>/dev/null)
          helm template lumovi charts/lumovi --set auth.mode=proxy \
            --set 'networkPolicy.from[0].podSelector.matchLabels.app=oauth2-proxy' \
            --show-only templates/networkpolicy.yaml | grep -q 'app: oauth2-proxy'
          # An agent's hub only over https (but on the same machine, as the agent itself allows).
          (! helm template lumovi charts/lumovi --set mode=agent --set agent.hubUrl=http://hub.example.com \
            --set agent.tokenSecret=agent 2>/dev/null)
          helm template lumovi charts/lumovi --set mode=agent --set agent.hubUrl=http://localhost:8080 \
            --set agent.tokenSecret=agent >/dev/null
          # The notes helm install prints, with no cluster to install to: NOTES.txt is a template like
          # the others, so a copy of the chart can print it.
          notes() {
            local chart
            chart=$(mktemp -d)
            cp -R charts/lumovi "$chart/"
            echo 'notes: {{ include "lumovi/templates/NOTES.txt" . | toJson }}' \
              > "$chart/lumovi/templates/notes.yaml"
            helm template lumovi "$chart/lumovi" --show-only templates/notes.yaml "$@"
          }
          # Agents named without their cluster's certificate authority: the notes say what that means,
          # and more, where nothing keeps what the hub trusts.
          fleet=(--set auth.mode=proxy --set fleet.agentsSecret=agents
            --set 'networkPolicy.from[0].podSelector.matchLabels.app=oauth2-proxy')
          notes "${fleet[@]}" | grep -q 'Give each its cluster'
          (! notes "${fleet[@]}" | grep -q 'again after every restart')
          notes "${fleet[@]}" --set auth.keepSessions=false | grep -q 'again after every restart'
          # Single sign-on with people's own tokens: no impersonation, so no ClusterRole.
          (! helm template lumovi charts/lumovi --set auth.mode=oidc \
            --set url=https://lumovi.example.com --set auth.oidc.issuer=https://dex.example.com \
            --set auth.oidc.clientId=lumovi --set auth.oidc.forwardToken=id \
            | grep -q 'kind: ClusterRole$')
          # Below a base path, AI assistants find how to sign in at the origin's root too.
          helm template lumovi charts/lumovi --set ingress.enabled=true --set basePath=/lumovi \
            | grep -q 'path: /.well-known/oauth-authorization-server/lumovi'
          # More than one replica, with assistants on or the audit history on its volume: refused;
          # their names are checked.
          (! helm template lumovi charts/lumovi --set replicaCount=2 2>/dev/null)
          (! helm template lumovi charts/lumovi --set replicaCount=2 --set assistants.enabled=false 2>/dev/null)
          helm template lumovi charts/lumovi --set replicaCount=2 --set assistants.enabled=false \
            --set audit.persistence.enabled=false >/dev/null
          (! helm template lumovi charts/lumovi --set assistants.chanegs=allow 2>/dev/null)
          helm template lumovi charts/lumovi --set 'assistants.redirectHosts={assistant.example.com}' \
            | grep -q 'value: "assistant.example.com"'
          # People's AI rules: a ConfigMap Lumovi may read and write, and nothing else; the
          # administrator's, as JSON; nothing at all with assistants off.
          helm template lumovi charts/lumovi | grep -q 'resourceNames: \[lumovi-assistant-rules\]'
          # What the keeper sends (a GET, a merge PATCH): the mock cluster doesn't check RBAC.
          [ "$(helm template lumovi charts/lumovi --set 'access.admins={a}' | grep -c 'verbs: \[get, patch\]')" = 3 ]
          grep -q "method: 'PATCH'" src/server/kept.ts && ! grep -q "method: 'PUT'" src/server/kept.ts
          helm template lumovi charts/lumovi --set 'assistants.rules[0].name=System' \
            --set 'assistants.rules[0].namespaces={kube-*}' --set 'assistants.rules[0].visibility=hidden' \
            | grep -q 'LUMOVI_ASSISTANT_RULES$'
          (! helm template lumovi charts/lumovi --set assistants.enabled=false | grep -q 'assistant-rules')
          (! helm template lumovi charts/lumovi --set 'assistants.rules[0].name=x' \
            --set 'assistants.rules[0].logs=maybe' 2>/dev/null)
          # Access: with admins, a ConfigMap Lumovi may read and write, and nothing else; what the
          # chart says, as JSON, checked; none of it without admins.
          helm template lumovi charts/lumovi --set 'access.admins={platform-admins}' \
            | grep -q 'resourceNames: \[lumovi-access\]'
          helm template lumovi charts/lumovi --set 'access.policy.limits[0].id=prod' \
            --set 'access.policy.limits[0].name=Production' --set 'access.policy.limits[0].caps.helm=upgrade' \
            | grep -q 'LUMOVI_ACCESS$'
          (! helm template lumovi charts/lumovi | grep -q 'lumovi-access')
          (! helm template lumovi charts/lumovi --set 'access.policy.everyone.changes=maybe' 2>/dev/null)
          # Sessions kept for a restart: a Secret Lumovi may read and write, and nothing else; none
          # when they're kept in memory, or for an agent.
          helm template lumovi charts/lumovi | grep -q 'resourceNames: \[lumovi-state\]'
          # What it's sealed with: a Secret of its own, given to Lumovi (its Role doesn't name it);
          # or one of yours.
          helm template lumovi charts/lumovi | grep -q 'name: lumovi-state-key$'
          (! helm template lumovi charts/lumovi | grep -q 'resourceNames: \[lumovi-state-key\]')
          helm template lumovi charts/lumovi | grep -A4 'name: LUMOVI_STATE_KEY' | grep -q 'name: lumovi-state-key'
          helm template lumovi charts/lumovi --set auth.stateKeySecret=mine \
            | grep -A4 'name: LUMOVI_STATE_KEY' | grep -q 'name: mine'
          (! helm template lumovi charts/lumovi --set auth.stateKeySecret=mine | grep -q 'lumovi-state-key')
          helm template lumovi charts/lumovi | grep -A1 'name: LUMOVI_STATE_SECRET' | grep -q 'value: lumovi-state'
          (! helm template lumovi charts/lumovi --set auth.keepSessions=false | grep -q 'lumovi-state')
          (! helm template lumovi charts/lumovi --set mode=agent --set agent.hubUrl=https://hub.example.com \
            --set agent.tokenSecret=t | grep -q 'lumovi-state')
          # The audit history: on a volume uninstalling keeps, one pod writing it at a time; a
          # claim of one's own, or none (memory); a webhook's headers from a Secret.
          helm template lumovi charts/lumovi | grep -q 'claimName: lumovi-audit'
          # The cluster's default storage class, none ('': a volume made by hand), or one named.
          (! helm template lumovi charts/lumovi | grep -q 'storageClassName')
          helm template lumovi charts/lumovi --set audit.persistence.storageClass='' | grep -q 'storageClassName: ""'
          helm template lumovi charts/lumovi --set audit.persistence.storageClass=fast | grep -q 'storageClassName: "fast"'
          # A company's network: the proxy and its certificate authority, for the server and an agent.
          helm template lumovi charts/lumovi --set proxy.https=http://proxy.corp:3128 \
            --set proxy.noProxy=.corp --set extraCA.configMap=corp-ca > net.yaml
          grep -q 'HTTPS_PROXY' net.yaml && grep -q 'NO_PROXY' net.yaml
          grep -q 'value: /etc/lumovi/ca/ca.crt' net.yaml && grep -q 'name: corp-ca' net.yaml
          helm template lumovi charts/lumovi --set mode=agent --set clusterName=edge \
            --set agent.hubUrl=https://hub.example.com --set agent.tokenSecret=t \
            --set proxy.https=http://proxy.corp:3128 --set extraCA.secret=corp-ca \
            | grep -q 'secretName: corp-ca'
          # A proxy with credentials, from a Secret: not in the Deployment; and not both ways.
          helm template lumovi charts/lumovi --set proxy.secret=corp-proxy \
            | grep -A3 'name: HTTPS_PROXY' | grep -q 'name: corp-proxy'
          (! helm template lumovi charts/lumovi --set proxy.secret=corp-proxy \
            --set proxy.https=http://proxy.corp:3128 2>/dev/null)
          # OpenShift gives the user and groups: none set there, its SCC's taken.
          (! helm template lumovi charts/lumovi --api-versions security.openshift.io/v1 | grep -qE 'runAsUser|runAsGroup|fsGroup')
          helm template lumovi charts/lumovi | grep -q 'runAsUser: 65532'
          (! helm template lumovi charts/lumovi --set openshift=true | grep -q 'runAsUser')
          helm template lumovi charts/lumovi --api-versions security.openshift.io/v1 --set openshift=false | grep -q 'runAsUser: 65532'
          helm template lumovi charts/lumovi | grep -q 'type: Recreate'
          helm template lumovi charts/lumovi --show-only templates/audit.yaml \
            | grep -q 'helm.sh/resource-policy: keep'
          (! helm template lumovi charts/lumovi --set audit.persistence.existingClaim=mine \
            | grep -q 'kind: PersistentVolumeClaim')
          helm template lumovi charts/lumovi --set audit.persistence.existingClaim=mine \
            | grep -q 'claimName: mine'
          (! helm template lumovi charts/lumovi --set audit.persistence.enabled=false \
            | grep -q 'LUMOVI_AUDIT_DIR\|Recreate')
          helm template lumovi charts/lumovi --set audit.webhook.url=https://siem.example.com/in \
            --set audit.webhook.headersSecret=hooks | grep -q 'key: headers.yaml'
          (! helm template lumovi charts/lumovi --set audit.level=everything 2>/dev/null)
          # A fleet, with every source; a member; an agent.
          helm template lumovi charts/lumovi --set auth.mode=proxy \
            --set 'networkPolicy.from[0].podSelector.matchLabels.app=oauth2-proxy' \
            --set fleet.kubeconfigSecret=fleet --set 'fleet.secrets={lumovi,cluster-api,argocd}' \
            --set 'fleet.secretNamespaces={lumovi,argocd}' --set fleet.agentsSecret=agents \
            --set fleet.labels.env=production >/dev/null
          helm template lumovi charts/lumovi --set mode=member | grep -q 'kubernetes.io/service-account-token'
          helm template lumovi charts/lumovi --set mode=agent --set agent.hubUrl=https://lumovi.example.com \
            --set agent.tokenSecret=agent | grep -q 'out/agent/agent.js'
          # What a fleet can't be: signed in to with a token, or an agent without its hub.
          (! helm template lumovi charts/lumovi --set fleet.kubeconfigSecret=fleet 2>/dev/null)
          (! helm template lumovi charts/lumovi --set mode=agent 2>/dev/null)

  e2e:
    name: E2E (${{ matrix.os }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Each platform's tests, split over four machines that run at once.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # The longest shard has taken 28 minutes: room for a few failing tests' retries, so that a
    # timeout doesn't hide which failed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # What's kept between runs, by the version of what it is: package-lock.json changes with
      # every release, and a new set of downloads each time would fill the cache.
      - name: Versions
        id: versions
        shell: bash
        run: |
          version() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          echo "electron=$(version electron)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(version playwright-core)" >> "$GITHUB_OUTPUT"
      # Electron's download, kept between runs: faster, and spared GitHub's occasional errors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}
      - run: npm ci
      # For Lumovi served from a cluster, in a browser (tests/web).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}
      # apt drops a mirror that stalls (30 s without a byte) and tries again, three times, rather
      # than waiting on it for hours; a slow one that keeps going is left to finish (it has taken
      # 7 minutes). The step stops within its own time whatever happens, and says so.
      - name: Install Chromium
        shell: bash
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then
            npx playwright install chromium
            exit
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 600 npx playwright install --with-deps chromium && exit 0
          echo "::error::Chromium couldn't be installed in 10 minutes: apt (or Playwright's download) stalled or failed. Run the job again."
          exit 1
      - name: Allow Chromium's sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces Electron's sandbox needs.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build with coverage instrumentation
        run: npm run build:coverage
      - name: Run e2e tests
        shell: bash
        env:
          # Nobody's watching: draw the windows, as transparent ones render slowly on Linux and
          # Windows (on macOS, transparent ones are the faster).
          LUMOVI_E2E_OPAQUE: ${{ runner.os != 'macOS' && '1' || '' }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test --shard="$SHARD"
          else
            npx playwright test --shard="$SHARD"
          fi
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ runner.os }}-${{ matrix.shard }}
          path: .nyc_output/
          include-hidden-files: true
          retention-days: 7
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  coverage:
    name: Coverage (all platforms)
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect coverage from every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .nyc_output
          merge-multiple: true
      - name: Report
        run: |
          npx nyc report --reporter=text --reporter=html --reporter=lcov --reporter=json-summary
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`
            console.log(["## E2E coverage (Linux + macOS + Windows)", "", "| | % | covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Require more than 95% coverage
        run: npm run coverage:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            only: --x64
            executable: release/linux-unpacked/lumovi
          # Built on the architecture it's for: terminals' node-pty is native.
          - os: ubuntu-24.04-arm
            only: --arm64
            executable: release/linux-arm64-unpacked/lumovi
          # macOS 26, for the Xcode that compiles the Liquid Glass icon (build/Lumovi.icon).
          - os: macos-26
            executable: release/mac-arm64/Lumovi.app/Contents/MacOS/Lumovi
          - os: windows-latest
            executable: release/win-unpacked/Lumovi.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # What's kept between runs, by the version of what it is: package-lock.json changes with
      # every release, and a new set of downloads each time would fill the cache.
      - name: Versions
        id: versions
        shell: bash
        run: |
          version() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          echo "electron=$(version electron)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(version playwright-core)" >> "$GITHUB_OUTPUT"
      # Electron's download, kept between runs: faster, and spared GitHub's occasional errors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}
      - run: npm ci
      - run: npm run build
      # Its bill of materials lists the helm it ships, the Go modules that helm is built from
      # (as helm itself says, from the binary pinned in scripts/helm.ts), and its Go.
      - name: Helm, in the bill of materials
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/helm-modules.ts --check
      # Playwright drives the app through the Node.js inspector, which release builds turn off.
      # (In bash: PowerShell would split the -c.… argument.)
      - run: npx electron-builder --dir ${{ matrix.only }} -c.electronFuses.enableNodeCliInspectArguments=true
        shell: bash
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The ARM image has fewer of the libraries a browser needs, and no virtual display.
      - if: matrix.os == 'ubuntu-24.04-arm'
        run: sudo npx playwright install-deps chromium
      - name: Smoke test the packaged app
        shell: bash
        env:
          LUMOVI_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: |
          # (Terminals too: node-pty, unpacked from the archive, signed where that's done.)
          specs=(tests/e2e/welcome.spec.ts tests/e2e/overview.spec.ts tests/e2e/local-terminal.spec.ts)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test "${specs[@]}"
          else
            npx playwright test "${specs[@]}"
          fi
      # The Microsoft Store's package: built, then installed and started as the Store would.
      - name: Build the Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows' own SDK's makeappx and makepri (the runner's newest), which know the manifest's
          # desktop6: electron-builder's bundled ones are older.
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object Name -like '10.*' | Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') } | Select-Object -First 1
          if (-not $kit) { throw 'No Windows SDK with makeappx.exe' }
          $env:ELECTRON_BUILDER_WINDOWS_KITS_PATH = $kit
          npx electron-builder --win appx --x64 --publish never
      - name: Install and start the Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # What it says it is: the Store's identity, and what it writes to AppData not redirected.
          $appx = Get-ChildItem release -Filter 'Lumovi-*-store-x64.appx' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'store'
          Copy-Item $appx.FullName "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          [xml]$manifest = Get-Content (Join-Path $dir 'AppxManifest.xml')
          $package = $manifest.Package
          if ($package.Identity.Name -ne 'PeterKota.Lumovi') { throw "Its identity is $($package.Identity.Name)" }
          if ($package.Identity.Publisher -ne 'CN=1A1E4958-8136-4D23-A653-58BADF043EA0') { throw "Not the Store's publisher" }
          if ($package.Properties.FileSystemWriteVirtualization -ne 'disabled') { throw 'What it writes is redirected' }
          if (-not ($package.Capabilities.Capability | Where-Object Name -eq 'unvirtualizedResources')) { throw 'No unvirtualizedResources' }
          # Installed as it is, as developer mode allows (the Store signs it), and started from Start.
          reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          Add-AppxPackage -Register (Join-Path $dir 'AppxManifest.xml')
          $installed = Get-AppxPackage PeterKota.Lumovi
          if ($installed.PackageFamilyName -ne 'PeterKota.Lumovi_kjge0drhgcaep') { throw "Its family is $($installed.PackageFamilyName)" }
          Start-Process "shell:AppsFolder\$($installed.PackageFamilyName)!Lumovi"
          # It writes its settings as it starts: where everything else sees them, not in a copy.
          $settings = Join-Path $env:APPDATA 'Lumovi\settings.json'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $settings) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (-not (Test-Path $settings)) { throw "It didn't start, or wrote elsewhere: no $settings" }
          $copy = Join-Path $env:LOCALAPPDATA "Packages\$($installed.PackageFamilyName)\LocalCache\Roaming\Lumovi"
          if (Test-Path $copy) { throw "What it writes was redirected to $copy" }
          Get-Process Lumovi | Stop-Process -Force
          Remove-AppxPackage $installed.PackageFullName

  integration:
    name: Integration (kind)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # What's kept between runs, by the version of what it is: package-lock.json changes with
      # every release, and a new set of downloads each time would fill the cache.
      - name: Versions
        id: versions
        shell: bash
        run: |
          version() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          echo "electron=$(version electron)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(version playwright-core)" >> "$GITHUB_OUTPUT"
      # Electron's download, kept between runs: faster, and spared GitHub's occasional errors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}
      - run: npm ci
      # kind and kubectl only: cluster.ts creates the cluster, with its own kubeconfig.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The image, as released, for Lumovi served from the cluster (cluster.ts installs it).
      - name: Build the image
        run: docker build --tag lumovi:integration .
      - name: Start the kind cluster, with metrics-server and Prometheus
        run: node tests/integration/cluster.ts up
      - name: Run the integration tests
        run: xvfb-run --auto-servernum npx playwright test -c playwright.integration.config.ts
      - name: Cluster state
        if: ${{ failure() }}
        run: |
          export KUBECONFIG=.kind/kubeconfig
          kubectl get nodes,pods --all-namespaces -o wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -60
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-integration
          path: |
            playwright-report-integration/
            test-results-integration/
          retention-days: 7

  # One check for the main branch's ruleset to require: whether every job above passed (theirs
  # are many, and change with the matrix).
  passed:
    name: CI passed
    if: always()
    needs: [checks, e2e, coverage, package, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
