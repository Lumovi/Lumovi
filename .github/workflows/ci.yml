name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never sign during CI builds.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  checks:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Allow Chromium's sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces Electron's sandbox needs.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build with coverage instrumentation
        run: npm run build:coverage
      - name: Run e2e tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test
          else
            npx playwright test
          fi
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: .nyc_output/
          include-hidden-files: true
          retention-days: 7
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  coverage:
    name: Coverage (all platforms)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect coverage from every platform
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: .nyc_output
          merge-multiple: true
      - name: Report
        run: |
          npx nyc report --reporter=text --reporter=html --reporter=lcov --reporter=json-summary
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`
            console.log(["## E2E coverage (Linux + macOS + Windows)", "", "| | % | covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Require 100% coverage
        run: npm run coverage:check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: release/linux-unpacked/kubestacks
          - os: macos-latest
            executable: release/mac-arm64/KubeStacks.app/Contents/MacOS/KubeStacks
          - os: windows-latest
            executable: release/win-unpacked/KubeStacks.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test the packaged app
        shell: bash
        env:
          KUBESTACKS_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: |
          specs="tests/e2e/welcome.spec.ts tests/e2e/overview.spec.ts"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test $specs
          else
            npx playwright test $specs
          fi

  real-cluster:
    name: Real cluster (kind)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubestacks
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build
      - name: Run against the kind cluster
        env:
          KUBESTACKS_E2E_REAL_CONTEXT: kind-kubestacks
        run: xvfb-run --auto-servernum npx playwright test tests/e2e/real-cluster.spec.ts
