name: Release

# Releases a version when it reaches main. Once CI passes on a commit whose
# package.json version has no release yet, this builds the installers for every
# platform (macOS signed and notarized, Windows signed), attaches them, their checksums and the
# software bill of materials (SBOM) to a GitHub release with the version's
# CHANGELOG notes, and publishes it, which tags the commit. The image and Helm
# chart for running Lumovi in a cluster go to GitHub's container registry,
# signed with cosign. Each is attested: built here, from this commit, of what. To release, bump the version, add its
# CHANGELOG section and push (see CONTRIBUTING.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand, to retry a release that failed part of the way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Find the version to release
    # Only what CI passed on main, pushed to this repository; by hand, only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: The version, unless it's released already
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json's version, $version, isn't a semantic version."
            exit 1
          fi
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "v$version is released already."
            exit 0
          fi
          # A release is newer than every one before it.
          mapfile -t tags < <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          if ! newer=$(node - "$version" "${tags[@]}" <<'EOF'
          const [version, ...tags] = process.argv.slice(2)
          const parse = (v) => {
            const [core, pre] = v.split(/-(.*)/)
            return [...core.split('.').map(Number), pre]
          }
          const compare = (a, b) => {
            const [x, y] = [parse(a), parse(b)]
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]
            if (x[3] === y[3]) return 0
            return !x[3] ? 1 : !y[3] ? -1 : x[3] < y[3] ? -1 : 1
          }
          const released = tags.filter((t) => /^\d+\.\d+\.\d+(-.+)?$/.test(t) && t !== version)
          const newer = released.find((t) => compare(version, t) < 0)
          if (newer) {
            console.log(newer)
            process.exit(1)
          }
          EOF
          ); then
            echo "::error::$version is older than v$newer, released already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # 1.1.0-beta.1 and the like are pre-releases, never the latest release.
          if [[ $version == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Its CHANGELOG section, for the release notes
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---

          **Downloads** are below: \`.dmg\` for macOS (signed and notarized by Apple), \`.exe\`
          for Windows (signed), \`.AppImage\`, \`.deb\` and \`.rpm\` for Linux. \`SHA256SUMS.txt\` lists
          their checksums, and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` checks
          that a file was built by this repository's release workflow.
          \`Lumovi-$VERSION.cdx.json\` is the software bill of materials (CycloneDX): the
          packages Lumovi is made of, and the helm it ships with the Go modules it's built
          from. How to check a release, the image and the chart:
          [SECURITY.md](https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md#checking-a-release).

          **In your cluster** ([documentation](https://docs.lumovi.dev/server/install)):
          \`helm install lumovi oci://ghcr.io/lumovi/charts/lumovi --version $VERSION\`, with the
          image \`ghcr.io/lumovi/lumovi:$VERSION\` for \`linux/amd64\` and \`linux/arm64\`.
          EOF
      # Created once, here: the builds below would otherwise race to create it.
      - name: Create the draft release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          # A draft left by an attempt that failed is started over.
          if gh release view "v$VERSION" >/dev/null 2>&1; then gh release delete "v$VERSION" --yes; fi
          gh release create "v$VERSION" --draft --target "$SHA" \
            --title "Lumovi $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Linux architecture on its own, where node-pty (terminals on this computer)
          # is built for it.
          - os: ubuntu-latest
            only: --linux --x64
          - os: ubuntu-24.04-arm
            only: --linux --arm64
          # macOS 26, for the Xcode that compiles the Liquid Glass icon (build/Lumovi.icon).
          - os: macos-26
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The signing secrets live in this environment, which only main can deploy from.
    environment: release
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    env:
      # Windows' certificate (Certum's, renewed each year): its thumbprint. Its name is
      # electron-builder.yml's publisherName.
      WIN_CERTIFICATE_SHA1: 4E6B3A2AEE86A28EABC65C90C1FE1E85D6756FB8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # It writes what the installers are made of, too: every package bundled into the app or
      # shipped beside it, Electron, and helm with its Go modules (out/sbom.cdx.json,
      # CycloneDX), attested with them below.
      - run: npm run build
      - name: Keep the software bill of materials
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: cp out/sbom.cdx.json "$RUNNER_TEMP/Lumovi-$VERSION.cdx.json"
      # Into a keychain of its own, which electron-builder signs from. (Given the certificate
      # itself, electron-builder 26 unlocks its keychain with the wrong password.)
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Apple's intermediate certificates, as electron-builder adds them itself otherwise.
          intermediates="$RUNNER_TEMP/apple-intermediates.keychain"
          cp node_modules/app-builder-lib/certs/root_certs.keychain "$intermediates"
          # Searched first, before the keychains already searched (bash 3.2: no mapfile).
          keychains=()
          while read -r line; do keychains+=("$(echo "$line" | tr -d '"')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "$intermediates" "${keychains[@]}"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # Notarization reads the App Store Connect API key from a file.
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      # Windows' key is Certum's, in its cloud: SimplySign Desktop, logged in, shows it to signtool
      # as a smart card, with the certificate in the user's store (scripts/simplysign.ts).
      - name: Log in to SimplySign
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_SIMPLYSIGN_ID: ${{ secrets.WIN_SIMPLYSIGN_ID }}
          WIN_SIMPLYSIGN_OTP_URI: ${{ secrets.WIN_SIMPLYSIGN_OTP_URI }}
        run: if [ -n "$WIN_SIMPLYSIGN_ID" ]; then node scripts/simplysign.ts; fi
      - name: Package and upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: builds are signed (and macOS builds notarized) when these secrets are set.
          SIGN: >-
            ${{ (runner.os == 'macOS' && secrets.MAC_CSC_LINK != '') ||
            (runner.os == 'Windows' && secrets.WIN_SIMPLYSIGN_ID != '') }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          # Unsigned builds shouldn't go looking for a certificate in a keychain.
          if [ "$SIGN" != true ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # Windows signs with the certificate SimplySign put in the user's store.
          certificate=()
          if [ "$SIGN" = true ] && [ "$RUNNER_OS" = Windows ]; then
            certificate=("-c.win.signtoolOptions.certificateSha1=$WIN_CERTIFICATE_SHA1")
          fi
          npx electron-builder --publish always ${{ matrix.only }} "${certificate[@]}"
      # Each signed with the certificate, and timestamped: the installer, and every program and
      # library it installs. Their own signatures: for Microsoft's libraries, Get-AuthenticodeSignature
      # would give the catalog of this Windows, which has the same ones.
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNED: ${{ secrets.WIN_SIMPLYSIGN_ID != '' }}
        run: |
          if ($env:SIGNED -ne 'true') { exit 0 }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          $files = @(Get-ChildItem release -Filter 'Lumovi-*-win.exe') + @(
            Get-ChildItem release\win-unpacked, release\win-arm64-unpacked -Recurse -File -Include *.exe, *.dll, *.node)
          $wrong = foreach ($file in $files) {
            $signer = try {
              [Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($file.FullName).GetCertHashString()
            } catch { 'no one' }
            # Valid, and (/tw) timestamped.
            & $signtool.FullName verify /pa /tw /q $file.FullName *> $null
            if ($LASTEXITCODE -ne 0 -or $signer -ne $env:WIN_CERTIFICATE_SHA1) {
              "$($file.FullName): signtool verify exited with $LASTEXITCODE, signed by $signer"
            }
          }
          if ($wrong) { $wrong; throw "$($wrong.Count) of $($files.Count) aren't signed as they should be." }
          "All $($files.Count) are signed by $env:WIN_CERTIFICATE_SHA1, and timestamped."
      # The Microsoft Store's packages (Microsoft signs them): for Partner Center, not the release.
      - name: Build the Microsoft Store packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows' own SDK's makeappx and makepri (the runner's newest), which know the manifest's
          # desktop6: electron-builder's bundled ones are older.
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object Name -like '10.*' | Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') } | Select-Object -First 1
          if (-not $kit) { throw 'No Windows SDK with makeappx.exe' }
          $env:ELECTRON_BUILDER_WINDOWS_KITS_PATH = $kit
          npx electron-builder --win appx --x64 --arm64 --publish never
      - name: Keep the Microsoft Store packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: microsoft-store-${{ needs.preflight.outputs.version }}
          path: release/Lumovi-*-store-*.appx
          if-no-files-found: error
      # A signed record that these files were built here, from this commit.
      - name: Attest the installers' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/Lumovi-*
      - name: Attest what the installers are made of
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: release/Lumovi-*
          sbom-path: ${{ runner.temp }}/Lumovi-${{ needs.preflight.outputs.version }}.cdx.json
      # Once, for the release: the same on every platform.
      - name: Add the software bill of materials to the release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: gh release upload "v$VERSION" "$RUNNER_TEMP/Lumovi-$VERSION.cdx.json" --clobber

  image:
    name: Image and Helm chart
    needs: preflight
    if: needs.preflight.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main deploys from this environment: what's pushed and signed is main's.
    environment: release
    permissions:
      contents: read
      # To push to GitHub's container registry, and attest what was pushed.
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ghcr.io/lumovi/lumovi
      CHARTS: ghcr.io/lumovi/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          # What it's made of (its packages, the system's and npm's), and how it was built, in
          # the registry with it.
          sbom: true
          provenance: mode=max
          # Pre-releases aren't the latest.
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ needs.preflight.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # Signed by this workflow's identity (keyless: GitHub's OIDC token, recorded in Rekor),
      # for admission controllers that check signatures: as a Sigstore bundle (an OCI referrer,
      # cosign 3's way), and as the .sig tag older controllers look for.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
      # What its JavaScript is made of, which BuildKit's own bill can't see (it's bundled):
      # taken from the image, and attested with it.
      - name: Take the image's software bill of materials
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          container=$(docker create --platform linux/amd64 "$IMAGE@$DIGEST")
          docker cp "$container:/app/licenses/sbom.cdx.json" "$RUNNER_TEMP/image.cdx.json"
          docker rm "$container" >/dev/null
      - name: Attest what the image is made of
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
          push-to-registry: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package and push the chart
        id: chart
        env:
          TOKEN: ${{ github.token }}
        run: |
          # The image it runs, for Artifact Hub to show (and scan) with the chart.
          yq -i '.annotations."artifacthub.io/images" = "- name: lumovi\n  image: " + strenv(IMAGE) + ":" + strenv(VERSION) + "\n"' \
            charts/lumovi/Chart.yaml
          helm package charts/lumovi --version "$VERSION" --app-version "$VERSION"
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "lumovi-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
      - name: Attest the chart's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.CHARTS }}/lumovi
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      # Who owns the chart repository, for Artifact Hub: as its artifacthub.io tag.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - name: Push Artifact Hub's metadata
        run: |
          oras push "$CHARTS/lumovi:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$CHARTS/lumovi@$DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "$CHARTS/lumovi@$DIGEST"

  publish:
    name: Checksums and publish
    needs: [preflight, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: v${{ needs.preflight.outputs.version }}
      SHA: ${{ needs.preflight.outputs.sha }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Add SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'Lumovi-*'
          # The installers and the bill of materials, not the files updates use to download less.
          files=()
          for file in Lumovi-*; do [[ $file == *.blockmap ]] || files+=("$file"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      # An annotated tag, on the commit CI passed: who tagged it, when, and why.
      - name: Tag the commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then exit 0; fi
          tag=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="Lumovi $VERSION" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag" --silent
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then kind=--prerelease; else kind=--latest; fi
          gh release edit "$TAG" --draft=false "$kind" --verify-tag

  aur:
    name: AUR (lumovi-bin)
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # makepkg, to write the .SRCINFO the AUR needs.
    container: archlinux:latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      # Published once AUR_SSH_PRIVATE_KEY is set: the key of the AUR account that maintains
      # lumovi-bin.
      - name: Whether it's published
        id: key
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY isn't set: lumovi-bin isn't updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.set
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: The package, on this release
        if: steps.key.outputs.set
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          # pacman's own download sandbox can't be set up in a container.
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git openssh >/dev/null
          sums=$(curl -fsSL "https://github.com/$GH_REPO/releases/download/v$VERSION/SHA256SUMS.txt")
          sum() { awk -v f="Lumovi-$VERSION-linux-$1.deb" '$2 == f { print $1 }' <<<"$sums"; }
          amd=$(sum amd64) arm=$(sum arm64)
          [ -n "$amd" ] && [ -n "$arm" ] || { echo "::error::SHA256SUMS.txt has no .deb files"; exit 1; }
          cd packaging/aur
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e 's/^pkgrel=.*/pkgrel=1/' \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$amd')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" PKGBUILD
          # makepkg won't run as root.
          useradd -m builder && chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          grep -E '^(pkgver|pkgrel|sha256sums)' PKGBUILD
      - name: Published
        if: steps.key.outputs.set
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone ssh://aur@aur.archlinux.org/lumovi-bin.git "$RUNNER_TEMP/aur"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "lumovi-bin is on $VERSION already."; exit 0; fi
          git -c user.name='Peter Kota' -c user.email='peter@lumovi.dev' \
            commit --quiet --message "lumovi-bin $VERSION"
          git push --quiet origin HEAD:master

  homebrew:
    name: Homebrew tap
    needs: [preflight, publish]
    # The cask follows the latest release, never a prerelease.
    if: needs.preflight.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The token is main's alone, as the signing keys are.
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # May start Lumovi/homebrew-tap's workflows (its Actions, read and write), and nothing else.
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # Its own schedule is the tap's fallback: GitHub drops scheduled runs when it's busy.
      - name: The tap, told
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN isn't set: the tap follows on its own schedule." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run update.yml --repo Lumovi/homebrew-tap
          echo "The Homebrew tap is updating to Lumovi $VERSION." >> "$GITHUB_STEP_SUMMARY"
