name: Release

# Releases a version when it reaches main. Once CI passes on a commit whose
# package.json version has no release yet, this builds the installers for every
# platform (macOS signed and notarized), attaches them and their checksums to a
# GitHub release with the version's CHANGELOG notes, and publishes it, which
# tags the commit. To release, bump the version, add its CHANGELOG section and
# push (see CONTRIBUTING.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand, to retry a release that failed part of the way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Find the version to release
    # Only what CI passed on main, pushed to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: The version, unless it's released already
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json's version, $version, isn't a semantic version."
            exit 1
          fi
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "v$version is released already."
            exit 0
          fi
          # A release is newer than every one before it.
          mapfile -t tags < <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          if ! newer=$(node - "$version" "${tags[@]}" <<'EOF'
          const [version, ...tags] = process.argv.slice(2)
          const parse = (v) => {
            const [core, pre] = v.split(/-(.*)/)
            return [...core.split('.').map(Number), pre]
          }
          const compare = (a, b) => {
            const [x, y] = [parse(a), parse(b)]
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]
            if (x[3] === y[3]) return 0
            return !x[3] ? 1 : !y[3] ? -1 : x[3] < y[3] ? -1 : 1
          }
          const released = tags.filter((t) => /^\d+\.\d+\.\d+(-.+)?$/.test(t) && t !== version)
          const newer = released.find((t) => compare(version, t) < 0)
          if (newer) {
            console.log(newer)
            process.exit(1)
          }
          EOF
          ); then
            echo "::error::$version is older than v$newer, released already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # 1.2.0-beta.1 and the like are pre-releases, never the latest release.
          if [[ $version == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Its CHANGELOG section, for the release notes
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---

          **Downloads** are below: \`.dmg\` for macOS (signed and notarized by Apple), \`.exe\`
          for Windows, \`.AppImage\`, \`.deb\` and \`.rpm\` for Linux. \`SHA256SUMS.txt\` lists
          their checksums, and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` checks
          that a file was built by this repository's release workflow.
          EOF
      # Created once, here: the builds below would otherwise race to create it.
      - name: Create the draft release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          # A draft left by an attempt that failed is started over.
          if gh release view "v$VERSION" >/dev/null 2>&1; then gh release delete "v$VERSION" --yes; fi
          gh release create "v$VERSION" --draft --target "$SHA" \
            --title "KubeStacks $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The signing secrets live in this environment, which only main can deploy from.
    environment: release
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run build
      # Notarization reads the App Store Connect API key from a file.
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      - name: Package and upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: builds are signed (and macOS builds notarized) when these secrets are set.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          # Unsigned builds shouldn't go looking for a certificate in the keychain.
          if [ -z "$CSC_LINK$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --publish always
      # A signed record that these files were built here, from this commit.
      - name: Attest the installers' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/KubeStacks-*

  publish:
    name: Checksums and publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: v${{ needs.preflight.outputs.version }}
      SHA: ${{ needs.preflight.outputs.sha }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Add SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'KubeStacks-*'
          # The installers, not the files updates use to download less.
          files=()
          for file in KubeStacks-*; do [[ $file == *.blockmap ]] || files+=("$file"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      # An annotated tag, on the commit CI passed: who tagged it, when, and why.
      - name: Tag the commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then exit 0; fi
          tag=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="KubeStacks $VERSION" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag" --silent
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then kind=--prerelease; else kind=--latest; fi
          gh release edit "$TAG" --draft=false "$kind" --verify-tag
