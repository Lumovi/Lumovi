name: Release

# Releases a version when it reaches main. Once CI passes on the commit that set a
# package.json version with no release yet, and once the release is approved (below), this
# builds the installers for every
# platform (macOS signed and notarized, Windows signed), attaches them, their checksums and the
# software bill of materials (SBOM) to a GitHub release with the version's
# CHANGELOG summary (its opening paragraphs, then a link to the rest), and publishes it, which tags the commit. The image and Helm
# chart for running Lumovi in a cluster go to GitHub's container registry,
# signed with cosign. Each is attested: built here, from this commit, of what. To release, bump the version, add its
# CHANGELOG section and push (see CONTRIBUTING.md).
#
# Nothing is signed, attested, pushed or published until the release is approved: every job that
# does any of it runs in the environment `release`, which holds the signing secrets, takes runs
# from main alone, and has two required reviewers, neither of whom can approve a run they started
# (and each job first checks who started it: below). The jobs that need it start together, right
# after the version is found, so they wait together and one approval lets them all go. Until
# then a run has made nothing but the release's notes, kept as a file with the run itself: no
# draft, no tag, nothing signed, and the job before the approval may only read. A run that's
# never approved stays so.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand, to retry a release that failed part of the way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Find the version to release
    # Only what CI passed on main, pushed to this repository; by hand, only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read only: nothing is made, here or anywhere, before the release is approved.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Every job's first step, so a job run again by itself asks too: this run was started by one
      # of the release accounts (the repository's variable RELEASE_ACCOUNTS; none set, and every
      # run is refused), and run again, if it was, by no one else. The environment's other reviewer
      # then approves it, never whoever started it. (GitHub judges that by who first started the
      # run, even when another runs it again, so a run that another ran again is refused here; and
      # so is one a bot started, the workflow's own token among them, whoever would approve it. For
      # a run started by CI's on main, CI's run is held to the same.) Which accounts they are is
      # asked here, so it's never written out in a log: only whether.
      - &started-by
        name: Started by a release account, and run by no one else since
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
          CI_ACTOR: ${{ github.event.workflow_run.actor.login }}
          CI_TRIGGERING: ${{ github.event.workflow_run.triggering_actor.login }}
          # (RELEASE_ACCOUNTS: logins, comma-separated, no spaces: a login with a space before it is never matched.)
          SET: ${{ vars.RELEASE_ACCOUNTS != '' }}
          ONE_OF_THEM: >-
            ${{ vars.RELEASE_ACCOUNTS != '' &&
            contains(format(',{0},', vars.RELEASE_ACCOUNTS), format(',{0},', github.actor)) }}
        run: |
          refused=0
          if [ "$SET" != true ]; then
            echo "::error::No release accounts are set (the repository's variable RELEASE_ACCOUNTS): no run starts a release."
            refused=1
          elif [ "$ONE_OF_THEM" != true ]; then
            echo "::error::Started by $ACTOR: only the release accounts start a release."
            refused=1
          fi
          if [ "$TRIGGERING" != "$ACTOR" ]; then
            echo "::error::Started by $ACTOR and run again by $TRIGGERING: only whoever started a release runs it again."
            refused=1
          fi
          if [ "$EVENT" = workflow_run ] && { [ "$CI_ACTOR" != "$ACTOR" ] || [ "$CI_TRIGGERING" != "$ACTOR" ]; }; then
            echo "::error::CI was started by $CI_ACTOR and run by $CI_TRIGGERING, and this by $ACTOR: one account starts a release."
            refused=1
          fi
          exit "$refused"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # With the commit before it: whether this one set the version (scripts/release-starts.ts).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: The version, unless it's released already
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json's version, $version, isn't a semantic version."
            exit 1
          fi
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "v$version is released already."
            exit 0
          fi
          # By itself, only from the commit that set the version.
          before=$(git show HEAD^:package.json 2> /dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2> /dev/null || true)
          node scripts/release-starts.ts "$version" "$before"
          if [ "$(grep -c '^starts=false$' "$GITHUB_OUTPUT")" != 0 ]; then exit 0; fi
          # A release is newer than every one before it (asked again as it's published: a run
          # may wait a long time for its approval).
          mapfile -t tags < <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          node scripts/release-starts.ts --newer "$version" "${tags[@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # 1.1.0-beta.1 and the like are pre-releases, never the latest release.
          if [[ $version == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Its CHANGELOG summary, for the release notes
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every entry is in the version's section: none still waits as a file of its own
          # (`npm version` gathers them; scripts/changelog.ts).
          waiting=$(find changelog.d -name '*.md' ! -name README.md | sort)
          if [ -n "$waiting" ]; then
            echo "::error::Entries still wait in changelog.d/, so $VERSION's notes would lack them: $(echo $waiting)"
            exit 1
          fi
          # The plugins it's built with: the release plugins.lock.json pins (scripts/plugins-bundle.ts).
          PLUGINS=$(node -p "require('./plugins.lock.json').version")
          PLUGINS_BUNDLE=$(node -p "require('./plugins.lock.json').bundle")
          # The notes are short: the section's opening paragraphs, what the version is, then a
          # link to all of it in CHANGELOG.md (the heading's own anchor, as GitHub makes it).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^(## \[|### )/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION, or no opening above its entries."
            exit 1
          fi
          heading=$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { print; exit }' CHANGELOG.md)
          anchor=$(printf '%s' "${heading#\#\# }" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9 -]//g; s/ /-/g')
          cat >> "$RUNNER_TEMP/notes.md" <<EOF
          [Full changelog](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md#$anchor) · [Docs](https://docs.lumovi.dev)

          ---

          **Downloads** are below: \`.dmg\` for macOS (signed and notarized by Apple), \`.exe\`
          for Windows (signed), \`.AppImage\`, \`.deb\` and \`.rpm\` for Linux. \`SHA256SUMS.txt\` lists
          their checksums, and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` checks
          that a file was built by this repository's release workflow.
          \`Lumovi-$VERSION.cdx.json\` is the software bill of materials (CycloneDX): the
          packages Lumovi is made of, and the helm it ships with the Go modules it's built
          from. How to check a release, the image and the chart:
          [SECURITY.md](https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md#checking-a-release).

          **In your cluster** ([documentation](https://docs.lumovi.dev/server/install)):
          \`helm install lumovi oci://ghcr.io/lumovi/charts/lumovi --version $VERSION\`, with the
          image \`ghcr.io/lumovi/lumovi:$VERSION\` for \`linux/amd64\` and \`linux/arm64\`.

          **Its plugins** are [Lumovi-plugins $PLUGINS](https://github.com/Lumovi/Lumovi-plugins/releases/tag/v$PLUGINS):
          the bundle \`plugins-$PLUGINS.json\`, SHA-256 \`$PLUGINS_BUNDLE\`, checked when this
          was built against that release's signature and attestation, by its release workflow.
          EOF
      # Kept with the run for the job that makes the draft release, once the release is approved:
      # nothing of a release exists before that.
      - name: Keep the notes
        if: steps.version.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Linux architecture on its own, where node-pty (terminals on this computer)
          # is built for it.
          - os: ubuntu-latest
            only: --linux --x64
          - os: ubuntu-24.04-arm
            only: --linux --arm64
          # macOS 26, for the Xcode that compiles the Liquid Glass icon (build/Lumovi.icon).
          - os: macos-26
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The signing secrets live in this environment, which only main can deploy from, and which
    # waits for its reviewer's approval: nothing below runs before it.
    environment: release
    permissions:
      contents: write
      # To see that this run's draft is made (the Linux build says so).
      actions: read
      # For the build provenance attestation.
      id-token: write
      attestations: write
    env:
      # Windows' certificate (Certum's, renewed each year): its thumbprint. Its name is
      # electron-builder.yml's publisherName.
      WIN_CERTIFICATE_SHA1: 4E6B3A2AEE86A28EABC65C90C1FE1E85D6756FB8
    steps:
      - *started-by
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      # The draft release, made here: after the approval, and once, by one of the builds (the
      # others would otherwise race to make it, each uploading to its own). A draft an earlier
      # run left is started over; this run's own (it has said so, below) is kept: when a build
      # that failed is run again by itself, it holds what the other builds uploaded.
      - name: The release's notes
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Create the draft release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            made=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-draft-made" --jq '.total_count')
            if [ "$made" != 0 ]; then
              echo "Run again: this run's draft of $VERSION is kept, with what's on it."
              exit 0
            fi
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --target "$SHA" \
            --title "Lumovi $VERSION" --notes-file "$RUNNER_TEMP/release-notes/notes.md"
      # What the other builds wait for: this run's own draft, not one an earlier run left, which
      # the step above is about to start over.
      - name: Say the draft is made
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-draft-made
          path: ${{ runner.temp }}/release-notes/notes.md
          overwrite: true
          retention-days: 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # It writes what the installers are made of, too: every package bundled into the app or
      # shipped beside it, Electron, and helm with its Go modules (out/sbom.cdx.json,
      # CycloneDX), attested with them below.
      - run: npm run build
      - name: Keep the software bill of materials
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: cp out/sbom.cdx.json "$RUNNER_TEMP/Lumovi-$VERSION.cdx.json"
      # Into a keychain of its own, which electron-builder signs from. (Given the certificate
      # itself, electron-builder 26 unlocks its keychain with the wrong password.)
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Apple's intermediate certificates, as electron-builder adds them itself otherwise.
          intermediates="$RUNNER_TEMP/apple-intermediates.keychain"
          cp node_modules/app-builder-lib/certs/root_certs.keychain "$intermediates"
          # Searched first, before the keychains already searched (bash 3.2: no mapfile).
          keychains=()
          while read -r line; do keychains+=("$(echo "$line" | tr -d '"')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "$intermediates" "${keychains[@]}"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # Notarization reads the App Store Connect API key from a file.
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      # Windows' key is Certum's, in its cloud: SimplySign Desktop, logged in, shows it to signtool
      # as a smart card, with the certificate in the user's store (scripts/simplysign.ts).
      - name: Log in to SimplySign
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_SIMPLYSIGN_ID: ${{ secrets.WIN_SIMPLYSIGN_ID }}
          WIN_SIMPLYSIGN_OTP_URI: ${{ secrets.WIN_SIMPLYSIGN_OTP_URI }}
        run: if [ -n "$WIN_SIMPLYSIGN_ID" ]; then node scripts/simplysign.ts; fi
      # (Made by the Linux build, seconds after the approval; this is minutes later.)
      - name: Wait for the draft release
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          for _ in $(seq 60); do
            made=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-draft-made" --jq '.total_count' 2> /dev/null || echo 0)
            if [ "$made" != 0 ]; then exit 0; fi
            sleep 10
          done
          echo "::error::The draft release for $VERSION wasn't made in ten minutes: the Linux build makes it as it starts."
          exit 1
      - name: Package and upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: builds are signed (and macOS builds notarized) when these secrets are set.
          SIGN: >-
            ${{ (runner.os == 'macOS' && secrets.MAC_CSC_LINK != '') ||
            (runner.os == 'Windows' && secrets.WIN_SIMPLYSIGN_ID != '') }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          # Unsigned builds shouldn't go looking for a certificate in a keychain.
          if [ "$SIGN" != true ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # Windows signs with the certificate SimplySign put in the user's store.
          certificate=()
          if [ "$SIGN" = true ] && [ "$RUNNER_OS" = Windows ]; then
            certificate=("-c.win.signtoolOptions.certificateSha1=$WIN_CERTIFICATE_SHA1")
          fi
          npx electron-builder --publish always ${{ matrix.only }} "${certificate[@]}"
      # Each signed with the certificate, and timestamped: the installer, and every program and
      # library it installs. Their own signatures: for Microsoft's libraries, Get-AuthenticodeSignature
      # would give the catalog of this Windows, which has the same ones.
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNED: ${{ secrets.WIN_SIMPLYSIGN_ID != '' }}
        run: |
          if ($env:SIGNED -ne 'true') { exit 0 }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          $files = @(Get-ChildItem release -Filter 'Lumovi-*-win.exe') + @(
            Get-ChildItem release\win-unpacked, release\win-arm64-unpacked -Recurse -File -Include *.exe, *.dll, *.node)
          $wrong = foreach ($file in $files) {
            $signer = try {
              [Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($file.FullName).GetCertHashString()
            } catch { 'no one' }
            # Valid, and (/tw) timestamped.
            & $signtool.FullName verify /pa /tw /q $file.FullName *> $null
            if ($LASTEXITCODE -ne 0 -or $signer -ne $env:WIN_CERTIFICATE_SHA1) {
              "$($file.FullName): signtool verify exited with $LASTEXITCODE, signed by $signer"
            }
          }
          if ($wrong) { $wrong; throw "$($wrong.Count) of $($files.Count) aren't signed as they should be." }
          "All $($files.Count) are signed by $env:WIN_CERTIFICATE_SHA1, and timestamped."
      # The Microsoft Store's packages (Microsoft signs them): for Partner Center, not the release.
      - name: Build the Microsoft Store packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows' own SDK's makeappx and makepri (the runner's newest), which know the manifest's
          # desktop6: electron-builder's bundled ones are older.
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object Name -like '10.*' | Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') } | Select-Object -First 1
          if (-not $kit) { throw 'No Windows SDK with makeappx.exe' }
          $env:ELECTRON_BUILDER_WINDOWS_KITS_PATH = $kit
          npx electron-builder --win appx --x64 --arm64 --publish never
      - name: Keep the Microsoft Store packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-${{ needs.preflight.outputs.version }}
          path: release/Lumovi-*-store-*.appx
          if-no-files-found: error
      # A signed record that these files were built here, from this commit.
      - name: Attest the installers' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/Lumovi-*
      - name: Attest what the installers are made of
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: release/Lumovi-*
          sbom-path: ${{ runner.temp }}/Lumovi-${{ needs.preflight.outputs.version }}.cdx.json
      # Once, for the release: the same on every platform.
      - name: Add the software bill of materials to the release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: gh release upload "v$VERSION" "$RUNNER_TEMP/Lumovi-$VERSION.cdx.json" --clobber

  image:
    name: Image and Helm chart
    needs: preflight
    if: needs.preflight.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main deploys from this environment, and only once its reviewer has approved the
    # release: what's pushed and signed is main's, and approved.
    environment: release
    permissions:
      contents: read
      # To push to GitHub's container registry, and attest what was pushed.
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ghcr.io/lumovi/lumovi
      CHARTS: ghcr.io/lumovi/charts
    steps:
      - *started-by
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          # What it's made of (its packages, the system's and npm's), and how it was built, in
          # the registry with it.
          sbom: true
          provenance: mode=max
          # Pre-releases aren't the latest.
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ needs.preflight.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # Signed by this workflow's identity (keyless: GitHub's OIDC token, recorded in Rekor),
      # for admission controllers that check signatures: as a Sigstore bundle (an OCI referrer,
      # cosign 3's way), and as the .sig tag older controllers look for.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
      # What its JavaScript is made of, which BuildKit's own bill can't see (it's bundled):
      # taken from the image, and attested with it.
      - name: Take the image's software bill of materials
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          container=$(docker create --platform linux/amd64 "$IMAGE@$DIGEST")
          docker cp "$container:/app/licenses/sbom.cdx.json" "$RUNNER_TEMP/image.cdx.json"
          docker rm "$container" >/dev/null
      - name: Attest what the image is made of
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
          push-to-registry: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package and push the chart
        id: chart
        env:
          TOKEN: ${{ github.token }}
        run: |
          # The image it runs, for Artifact Hub to show (and scan) with the chart.
          yq -i '.annotations."artifacthub.io/images" = "- name: lumovi\n  image: " + strenv(IMAGE) + ":" + strenv(VERSION) + "\n"' \
            charts/lumovi/Chart.yaml
          helm package charts/lumovi --version "$VERSION" --app-version "$VERSION"
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "lumovi-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
      - name: Attest the chart's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.CHARTS }}/lumovi
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      # Who owns the chart repository, for Artifact Hub: as its artifacthub.io tag.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - name: Push Artifact Hub's metadata
        run: |
          oras push "$CHARTS/lumovi:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$CHARTS/lumovi@$DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "$CHARTS/lumovi@$DIGEST"

  # Runs only after the approved jobs, and only when they've succeeded: never `always()`,
  # `!cancelled()` or a `needs` without build and image, or it would publish what wasn't approved.
  publish:
    name: Checksums and publish
    needs: [preflight, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: v${{ needs.preflight.outputs.version }}
      SHA: ${{ needs.preflight.outputs.sha }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - *started-by
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Asked again here: this run may have waited days for its approval, and an older version
      # mustn't be published as the latest over one released meanwhile.
      - name: Still newer than every release
        run: |
          mapfile -t tags < <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          node scripts/release-starts.ts --newer "$VERSION" "${tags[@]}"
      # Every file a release is made of, by name, or nothing is published: a build run again
      # by itself must never leave a release of one platform's installers alone.
      - name: The draft is whole
        run: |
          mapfile -t files < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          node scripts/release-starts.ts --whole "$VERSION" "$PRERELEASE" "${files[@]}"
      - name: Add SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'Lumovi-*'
          # The installers and the bill of materials, not the files updates use to download less.
          files=()
          for file in Lumovi-*; do [[ $file == *.blockmap ]] || files+=("$file"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      # An annotated tag, on the commit CI passed: who tagged it, when, and why.
      - name: Tag the commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then exit 0; fi
          tag=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="Lumovi $VERSION" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag" --silent
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then kind=--prerelease; else kind=--latest; fi
          gh release edit "$TAG" --draft=false "$kind" --verify-tag

  aur:
    name: AUR (lumovi-bin)
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # makepkg, to write the .SRCINFO the AUR needs.
    container: archlinux:latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - *started-by
      # Published once AUR_SSH_PRIVATE_KEY is set: the key of the AUR account that maintains
      # lumovi-bin.
      - name: Whether it's published
        id: key
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY isn't set: lumovi-bin isn't updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.set
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: The package, on this release
        if: steps.key.outputs.set
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          # pacman's own download sandbox can't be set up in a container.
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git openssh >/dev/null
          sums=$(curl -fsSL "https://github.com/$GH_REPO/releases/download/v$VERSION/SHA256SUMS.txt")
          sum() { awk -v f="Lumovi-$VERSION-linux-$1.deb" '$2 == f { print $1 }' <<<"$sums"; }
          amd=$(sum amd64) arm=$(sum arm64)
          [ -n "$amd" ] && [ -n "$arm" ] || { echo "::error::SHA256SUMS.txt has no .deb files"; exit 1; }
          cd packaging/aur
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e 's/^pkgrel=.*/pkgrel=1/' \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$amd')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" PKGBUILD
          # makepkg won't run as root.
          useradd -m builder && chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          grep -E '^(pkgver|pkgrel|sha256sums)' PKGBUILD
      - name: Published
        if: steps.key.outputs.set
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone ssh://aur@aur.archlinux.org/lumovi-bin.git "$RUNNER_TEMP/aur"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "lumovi-bin is on $VERSION already."; exit 0; fi
          git -c user.name='Peter Kota' -c user.email='peter@lumovi.dev' \
            commit --quiet --message "lumovi-bin $VERSION"
          git push --quiet origin HEAD:master

  homebrew:
    name: Homebrew tap
    # It starts with the builds, not after publishing: a job that comes to the environment later
    # in a run waits for an approval of its own, and one approval a release is enough. So it's
    # let go with the rest, and then waits here for the release to be published.
    needs: preflight
    # The cask follows the latest release, never a prerelease.
    if: needs.preflight.outputs.version != '' && needs.preflight.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    # The token is main's alone, as the signing keys are.
    environment: release
    permissions:
      # To see the release published, and how this run's publishing went.
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *started-by
      - name: Wait for the release to be published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every half minute, for two hours; sooner done if this run's publishing didn't happen.
          for _ in $(seq 240); do
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null)" = false ]; then exit 0; fi
            publishing=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Checksums and publish") | .conclusion // ""' 2> /dev/null || true)
            case "$publishing" in
              failure | cancelled | skipped)
                echo "::error::Lumovi $VERSION wasn't published by this run ($publishing), so the Homebrew tap wasn't told. It's told by the run that does publish it, or follows on its own schedule."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Lumovi $VERSION wasn't published within two hours, so the Homebrew tap wasn't told. It's told by the run that does publish it, or follows on its own schedule."
          exit 1
      # Its own schedule is the tap's fallback: GitHub drops scheduled runs when it's busy.
      - name: The tap, told
        env:
          # May start Lumovi/homebrew-tap's workflows (its Actions, read and write), and nothing else.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN isn't set: the tap follows on its own schedule." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run update.yml --repo Lumovi/homebrew-tap
          echo "The Homebrew tap is updating to Lumovi $VERSION." >> "$GITHUB_STEP_SUMMARY"
