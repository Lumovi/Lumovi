name: Kubernetes' signing

# Each week, whether what the desktop app checks kubectl's signature against still holds: if
# Sigstore's trust root has changed, a pull request with the new one; if Kubernetes' instructions
# no longer name the signer Lumovi knows, an issue. Either way, a Lumovi without the change
# refuses new kubectls (terminals use the installed one) until a release brings it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # The checks alone, when what they run changes.
  pull_request:
    paths:
      - .github/workflows/kubernetes-signing.yml
      - scripts/sigstore-root.ts
      - scripts/kubernetes-signer.ts
      - src/main/kubernetes-signer.ts

permissions: {}

jobs:
  check:
    name: The checks, as a pull request changes them
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sigstore's trust root, through TUF
        run: node scripts/sigstore-root.ts
      - name: Kubernetes' signer, as its instructions name it
        run: node scripts/kubernetes-signer.ts

  # Taken again by code from npm (@sigstore/tuf and what it uses), so with nothing it could change:
  # a token that reads, and none left in .git for it to find.
  trust-root:
    name: Sigstore's trust root
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.root.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Taken again, through TUF
        id: root
        run: node scripts/sigstore-root.ts
      - name: For the pull request
        if: steps.root.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigstore-root
          path: src/main/sigstore-root.json
          retention-days: 7

  # What may push and open a pull request runs nothing from npm: git, gh and jq alone.
  trust-root-pr:
    name: Sigstore's trust root, proposed
    needs: trust-root
    if: needs.trust-root.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Its branch, and its pull request.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sigstore-root
          path: ${{ runner.temp }}/sigstore-root
      - name: The trust root alone, as it must be
        run: |
          # Only its four keys, each what it must be: it's all that's taken from the other job.
          jq -e '
            (keys == ["certificateAuthorities", "ctlogs", "source", "taken"]) and
            (.source | type == "string") and (.taken | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
            (.certificateAuthorities | type == "array" and length > 0) and
            (.ctlogs | type == "array" and length > 0)
          ' "$RUNNER_TEMP/sigstore-root/sigstore-root.json" > /dev/null
          cp "$RUNNER_TEMP/sigstore-root/sigstore-root.json" src/main/sigstore-root.json
      - name: A pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sigstore-root
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -am "chore: Sigstore's trust root, as it is on $(date -u +%F)"
          # One branch: next week's change replaces this week's, if it's still open.
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "Sigstore's trust root, as it is now" --body "$(cat <<EOF
          Sigstore's certificate authorities or its certificate transparency logs have changed: [this week's check]($RUN) took its trust root again, through its TUF repository, and it's not the one Lumovi ships (\`src/main/sigstore-root.json\`).

          A kubectl signed under what's new is refused by a Lumovi without it (its terminals use the installed kubectl, saying an update may be needed), so this should reach a release soon.

          Before merging:
          - **Start its CI: close this pull request, and reopen it.** One this check opens starts none (GitHub's rule for its token), and \`main\` takes it only once _CI passed_, which only a pull request's own CI gives. (CI started otherwise, by hand on the branch, isn't counted.)
          - **Compare it with the one Sigstore publishes**, [sigstore/root-signing's \`targets/trusted_root.json\`](https://github.com/sigstore/root-signing/blob/main/targets/trusted_root.json). The job that took it ran code from npm, and this pull request's checks look only at its shape: whoever merges it is the last check. Nothing should differ (the repository can be a little behind or ahead of what TUF serves: a difference is a reason to look closer, not to merge):

            \`\`\`sh
            git fetch origin sigstore-root
            diff <(curl -fsSL https://raw.githubusercontent.com/sigstore/root-signing/main/targets/trusted_root.json | jq '{certificateAuthorities, ctlogs}') \\
              <(git show origin/sigstore-root:src/main/sigstore-root.json | jq '{certificateAuthorities, ctlogs}')
            \`\`\`
          - Look at what changed (a new authority or log, and when each is valid from and to), and add a CHANGELOG line.
          EOF
          )"
          fi

  signer:
    name: Kubernetes' signer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # An issue, when Kubernetes no longer names it.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      # Nothing to install: src/main/kubernetes-signer.ts imports nothing.
      - name: As Kubernetes' instructions name it
        id: signer
        run: node scripts/kubernetes-signer.ts
      - name: An issue, if they no longer seem to
        if: steps.signer.outputs.named == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Kubernetes' instructions may no longer name the signer Lumovi checks kubectl against
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Once, until it's dealt with.
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number')" ]; then
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          [This week's check]($RUN) didn't find the identity and issuer Lumovi checks a kubectl's certificate for (\`src/main/kubernetes-signer.ts\`) in the \`cosign verify-blob\` command of Kubernetes' [instructions for checking its signatures](https://kubernetes.io/docs/tasks/administer-cluster/verify-signed-artifacts/).

          It may only be a rewording of the instructions: read them by hand first. If they name the same signer in other words, \`scripts/kubernetes-signer.ts\` needs to read them as they are now.

          If Kubernetes has changed how it signs, every Lumovi refuses new kubectls (its terminals use the installed one, saying an update may be needed) until \`src/main/kubernetes-signer.ts\` names the new signer and a release ships it.
          EOF
          )"
