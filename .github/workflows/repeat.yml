name: Repeat a test

# Runs chosen tests many times over on one platform, to show that one a runner's timing could
# fail doesn't. Not part of CI: started by hand (Actions → Repeat a test), or by pushing a branch
# named repeat/…, which runs what's set here by default.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The spec file
        default: tests/web/audit.spec.ts
      grep:
        description: Which of its tests (a pattern for their titles)
        default: 'one Lumovi keeps a history|started at the same moment|another took over|two containers of one name|can’t reach its lock|folder goes while|held up while another'
      times:
        description: How many times each
        default: '50'
      os:
        description: Where
        type: choice
        default: windows-latest
        options: [windows-latest, ubuntu-latest, macos-latest]
  push:
    branches: ['repeat/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  repeat:
    name: ${{ inputs.times || '25' }} times on ${{ inputs.os || 'ubuntu-latest' }} (${{ matrix.shard }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        shell: bash
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install chromium
          fi
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build with coverage instrumentation
        run: npm run build:coverage
      - name: Run them
        shell: bash
        env:
          LUMOVI_E2E_OPAQUE: ${{ runner.os != 'macOS' && '1' || '' }}
          LUMOVI_E2E_BROWSERS: all
          SPEC: ${{ inputs.spec || 'tests/web/plugin-box.spec.ts' }}
          GREP: ${{ inputs.grep || 'on the box’s own page, only what’s named gets out' }}
          TIMES: ${{ inputs.times || '25' }}
          SHARD: ${{ matrix.shard }}
        # No second tries: a test that passes on its retry has failed here.
        run: |
          # shellcheck disable=SC2086
          run=(npx playwright test $SPEC --repeat-each "$TIMES" --retries 0 --shard "$SHARD")
          if [ -n "$GREP" ]; then run+=(--grep "$GREP"); fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum "${run[@]}"
          else
            "${run[@]}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: playwright-report-repeat-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
