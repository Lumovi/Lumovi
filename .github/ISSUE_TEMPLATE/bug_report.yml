name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open cluster …
        2. Go to …
  - type: input
    id: version
    attributes:
      label: KubeStacks version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Kubernetes version and distribution
      placeholder: v1.34 on EKS / GKE / kind / k3s …
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please remove anything sensitive, such as cluster addresses, names or secrets.
