name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the question you want KubeStacks to answer.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: KubeStacks changes clusters only through its guard rails (permission checks first, the equivalent command shown, undo where it can). If your idea changes things, say how it fits them.
