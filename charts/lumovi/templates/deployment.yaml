{{- if include "lumovi.dashboard" . }}
{{- $basePath := include "lumovi.basePath" . }}
{{- $fleet := include "lumovi.fleet" . }}
{{- if and (eq .Values.auth.mode "oidc") (not .Values.url) }}
{{- fail "url must be set for single sign-on (auth.mode oidc): the provider sends people back there" }}
{{- end }}
{{- if and .Values.assistants.enabled (gt (int .Values.replicaCount) 1) }}
{{- fail "AI assistants need a single replica (replicaCount 1): what they're allowed lives in its memory, and their requests carry no cookies to stick to one. Set assistants.enabled false to run more" }}
{{- end }}
{{- if and .Values.audit.persistence.enabled (gt (int .Values.replicaCount) 1) }}
{{- fail "The audit history on its volume needs a single replica (replicaCount 1): it's one chain, kept by one replica. Set audit.persistence.enabled false to run more (their events still go to their output and the webhook)" }}
{{- end }}
{{- if and $fleet (eq .Values.auth.mode "token") }}
{{- fail "A fleet needs single sign-on or a proxy (auth.mode oidc or proxy): a pasted token only says who someone is to one cluster" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumovi.fullname" . }}
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.audit.persistence.enabled }}
  # One writes the audit history at a time: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "lumovi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A change to the views rolls out a new pod, which reads them. (A fleet's kubeconfig is
        # read again as it changes.)
        checksum/views: {{ toJson .Values.views | sha256sum }}
        {{- if .Values.auth.keepSessions }}
        {{- $keySecret := .Values.auth.stateKeySecret | default (printf "%s-state-key" (include "lumovi.fullname" .)) }}
        {{- $key := lookup "v1" "Secret" .Release.Namespace $keySecret }}
        # A new state key (rotated after a leak, say) rolls out a new pod, which seals with it.
        checksum/state-key: {{ get (get $key "data" | default dict) "key" | default "" | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lumovi.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lumovi.serviceAccountName" . }}
      # Its token reaches the API server (with impersonation), and its CA checks it.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "lumovi.podSecurityContext" . | nindent 8 }}
      containers:
        - name: lumovi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LUMOVI_PORT
              value: "8080"
            - name: LUMOVI_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: LUMOVI_BASE_PATH
              value: {{ $basePath | quote }}
            {{- with .Values.url }}
            - name: LUMOVI_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LUMOVI_AUTH
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            {{- with .Values.auth.oidc }}
            - name: LUMOVI_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer must be set for single sign-on" .issuer | quote }}
            - name: LUMOVI_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId must be set for single sign-on" .clientId | quote }}
            {{- if or .clientSecret .existingSecret }}
            - name: LUMOVI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | default (printf "%s-oidc" (include "lumovi.fullname" $)) }}
                  key: client-secret
            {{- end }}
            - name: LUMOVI_OIDC_SCOPES
              value: {{ .scopes | quote }}
            - name: LUMOVI_OIDC_USERNAME_CLAIM
              value: {{ .usernameClaim | quote }}
            - name: LUMOVI_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            {{- with .providerName }}
            - name: LUMOVI_OIDC_PROVIDER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .forwardToken }}
            - name: LUMOVI_OIDC_FORWARD_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.auth.mode "proxy" }}
            - name: LUMOVI_PROXY_USER_HEADER
              value: {{ .Values.auth.proxy.userHeader | quote }}
            - name: LUMOVI_PROXY_GROUPS_HEADER
              value: {{ .Values.auth.proxy.groupsHeader | quote }}
            {{- with .Values.auth.proxy.signOutUrl }}
            - name: LUMOVI_PROXY_SIGN_OUT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.auth.usernamePrefix }}
            - name: LUMOVI_USERNAME_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.groupsPrefix }}
            - name: LUMOVI_GROUPS_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: LUMOVI_SESSION_HOURS
              value: {{ .Values.auth.sessionHours | quote }}
            {{- if .Values.auth.keepSessions }}
            - name: LUMOVI_STATE_SECRET
              value: {{ include "lumovi.fullname" . }}-state
            - name: LUMOVI_STATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.stateKeySecret | default (printf "%s-state-key" (include "lumovi.fullname" .)) }}
                  key: key
            {{- end }}
            - name: LUMOVI_READ_ONLY
              value: {{ .Values.readOnly | quote }}
            - name: LUMOVI_ASSISTANTS
              value: {{ ternary "on" "off" .Values.assistants.enabled | quote }}
            {{- with include "lumovi.assistantChanges" . }}
            - name: LUMOVI_ASSISTANT_CHANGES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.assistants.rules }}
            - name: LUMOVI_ASSISTANT_RULES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.assistants.enabled }}
            - name: LUMOVI_ASSISTANT_RULES_CONFIGMAP
              value: {{ include "lumovi.fullname" . }}-assistant-rules
            {{- end }}
            {{- with .Values.assistants.redirectHosts }}
            - name: LUMOVI_ASSISTANT_REDIRECT_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.access.admins }}
            - name: LUMOVI_ADMINS
              value: {{ join "," . | quote }}
            - name: LUMOVI_ACCESS_CONFIGMAP
              value: {{ include "lumovi.fullname" $ }}-access
            {{- end }}
            {{- with .Values.access.policy }}
            - name: LUMOVI_ACCESS
              value: {{ toJson . | quote }}
            {{- end }}
            - name: LUMOVI_AUDIT_LEVEL
              value: {{ .Values.audit.level | quote }}
            {{- with .Values.audit.auditors }}
            - name: LUMOVI_AUDITORS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: LUMOVI_AUDIT_STDOUT
              value: {{ .Values.audit.stdout | quote }}
            {{- if .Values.audit.persistence.enabled }}
            - name: LUMOVI_AUDIT_DIR
              value: /var/lib/lumovi/audit
            {{- end }}
            - name: LUMOVI_AUDIT_RETENTION_DAYS
              value: {{ .Values.audit.retentionDays | quote }}
            {{- with .Values.audit.webhook }}
            {{- if .url }}
            - name: LUMOVI_AUDIT_WEBHOOK_URL
              value: {{ .url | quote }}
            - name: LUMOVI_AUDIT_WEBHOOK_FORMAT
              value: {{ .format | quote }}
            {{- with .headersSecret }}
            - name: LUMOVI_AUDIT_WEBHOOK_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: headers.yaml
            {{- end }}
            {{- end }}
            {{- end }}
            - name: LUMOVI_METRICS_SOURCE
              value: {{ .Values.metrics.source | quote }}
            - name: LUMOVI_ALLOW_PRIVATE_CHARTS
              value: {{ .Values.helm.allowPrivateCharts | quote }}
            - name: LUMOVI_ARTIFACT_HUB_URL
              value: {{ .Values.helm.artifactHubUrl | quote }}
            - name: LUMOVI_VIEWS_DIR
              value: /etc/lumovi/views
            - name: LUMOVI_NODE_SHELL
              value: {{ ternary "on" "off" .Values.nodeShell.enabled | quote }}
            - name: LUMOVI_NODE_SHELL_NAMESPACE
              value: {{ .Values.nodeShell.namespace | quote }}
            - name: LUMOVI_NODE_SHELL_IMAGE
              value: {{ .Values.nodeShell.image | quote }}
            {{- if $fleet }}
            {{- with .Values.fleet }}
            {{- if .kubeconfigSecret }}
            - name: LUMOVI_FLEET_KUBECONFIG_FILE
              value: /etc/lumovi/fleet/kubeconfig
            {{- end }}
            {{- with .secrets }}
            - name: LUMOVI_FLEET_SECRETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .secretNamespaces }}
            - name: LUMOVI_FLEET_SECRETS_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .agentsSecret }}
            - name: LUMOVI_FLEET_AGENTS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: agents.yaml
            {{- end }}
            - name: LUMOVI_FLEET_LOCAL
              value: {{ .includeThisCluster | quote }}
            {{- end }}
            {{- with .Values.fleet.labels }}
            - name: LUMOVI_CLUSTER_LABELS
              value: {{ include "lumovi.labelList" . | quote }}
            {{- end }}
            {{- else }}
            {{- with .Values.clusterLabels }}
            - name: LUMOVI_CLUSTER_LABELS
              value: {{ include "lumovi.labelList" . | quote }}
            {{- end }}
            {{- end }}
            {{- include "lumovi.networkEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $basePath }}healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $basePath }}healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # helm's caches, and the kubeconfigs Lumovi writes for each run of it.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.views }}
            - name: views
              mountPath: /etc/lumovi/views
              readOnly: true
            {{- end }}
            {{- if and $fleet .Values.fleet.kubeconfigSecret }}
            - name: fleet
              mountPath: /etc/lumovi/fleet
              readOnly: true
            {{- end }}
            {{- if .Values.audit.persistence.enabled }}
            - name: audit
              mountPath: /var/lib/lumovi/audit
            {{- end }}
            {{- include "lumovi.caMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "lumovi.caVolume" . | nindent 8 }}
        {{- if .Values.views }}
        - name: views
          configMap:
            name: {{ include "lumovi.fullname" . }}-views
        {{- end }}
        {{- if .Values.audit.persistence.enabled }}
        - name: audit
          persistentVolumeClaim:
            claimName: {{ .Values.audit.persistence.existingClaim | default (printf "%s-audit" (include "lumovi.fullname" .)) }}
        {{- end }}
        {{- if and $fleet .Values.fleet.kubeconfigSecret }}
        - name: fleet
          secret:
            secretName: {{ .Values.fleet.kubeconfigSecret }}
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
