{{- if and (include "lumovi.dashboard" .) .Values.auth.keepSessions }}
# What a restart (an upgrade, say) mustn't lose: who's signed in, and the AI assistants they
# allowed, each entry sealed with the key below. No credential is in it: cookies and tokens by
# their hash, and a person's own token sealed again with a key only their cookie gives. Lumovi
# reads and writes this Secret (and nothing else here); upgrades leave what's in it.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "lumovi.fullname" . }}-state
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
{{- if not .Values.auth.stateKeySecret }}
{{- $key := printf "%s-state-key" (include "lumovi.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $key }}
---
# The key what's kept is sealed with: apart from it, so that whoever can write that Secret can't
# make an entry that opens (a session as someone, say). Made once, and kept by upgrades; Lumovi
# doesn't read it (it's given it, as LUMOVI_STATE_KEY). Where the chart is rendered with helm
# template (Argo CD), lookup sees nothing: give auth.stateKeySecret instead.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $key }}
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
data:
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lumovi.fullname" . }}-state
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "lumovi.fullname" . }}-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lumovi.fullname" . }}-state
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lumovi.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "lumovi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
