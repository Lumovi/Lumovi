{{- $proxy := eq .Values.auth.mode "proxy" }}
{{- if and (include "lumovi.dashboard" .) (or .Values.networkPolicy.enabled $proxy) }}
{{- if and $proxy (not .Values.networkPolicy.from) }}
{{- fail (printf "auth.mode proxy trusts the %s header from whoever reaches Lumovi: set networkPolicy.from to the proxy's pods (a podSelector, with a namespaceSelector if it runs in another namespace), so that nobody else can" .Values.auth.proxy.userHeader) }}
{{- end }}
# Only what `from` allows reaches Lumovi (with auth.mode proxy: the proxy alone).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lumovi.fullname" . }}
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lumovi.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
