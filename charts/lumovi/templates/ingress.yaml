{{- if and (include "lumovi.dashboard" .) .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lumovi.fullname" . }}
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ include "lumovi.basePath" $ }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "lumovi.fullname" $ }}
                port:
                  name: http
          {{- $base := include "lumovi.basePath" $ }}
          {{- if and $.Values.assistants.enabled (ne $base "/") }}
          # Where AI assistants look for how to sign in: the origin's root, with the base path after.
          {{- range list (printf "/.well-known/oauth-authorization-server%s" (trimSuffix "/" $base)) (printf "/.well-known/oauth-protected-resource%smcp" $base) }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "lumovi.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
