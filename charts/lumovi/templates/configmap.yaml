{{- if and (include "lumovi.dashboard" .) (.Values.plugins) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumovi.fullname" . }}-plugins
  labels:
    {{- include "lumovi.labels" . | nindent 4 }}
data:
  {{- range $name, $plugin := .Values.plugins }}
  {{ $name }}: |
    {{- $plugin | nindent 4 }}
  {{- end }}
{{- end }}
