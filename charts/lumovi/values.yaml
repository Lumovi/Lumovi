# Lumovi, served from your cluster. What each setting does:
# https://docs.lumovi.dev/server/helm-values

# What this release is:
# - dashboard: Lumovi, showing this cluster to whoever signs in, or a fleet of clusters
#   (see fleet).
# - member: what a fleet's Lumovi needs here to reach this cluster: a service account that
#   may only impersonate, and its token. The notes after installing say how to add it.
# - agent: a fleet's agent, for a cluster its Lumovi can't reach. It dials Lumovi (see agent).
mode: dashboard

image:
  repository: ghcr.io/lumovi/lumovi
  # The chart's appVersion unless set.
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

# What Lumovi calls the cluster: in its pages, their addresses and titles. An agent's name
# at its fleet's Lumovi, too.
clusterName: in-cluster
# What the cluster is labelled with, like { env: production }, for AI assistants' rules that
# match clusters by label (in a fleet, its clusters' are fleet.labels and theirs).
clusterLabels: {}

# Many clusters, rather than this one: see https://docs.lumovi.dev/server/fleet. People
# sign in with auth.mode oidc or proxy, and see each cluster as their RBAC there allows.
fleet:
  # A Secret with a kubeconfig under `kubeconfig`, each context of which is a cluster. Its
  # users may only impersonate (a member's token), and a context's lumovi.dev extension
  # gives it labels, the groups who see it, and whether people's own tokens are passed on.
  # Lumovi reads it again as it changes.
  kubeconfigSecret: ''
  # Secrets that describe clusters, read again every 30 seconds: lumovi (labelled
  # lumovi.dev/cluster, with a kubeconfig under kubeconfig), cluster-api (each cluster's
  # <name>-kubeconfig) and argocd (Argo CD's cluster Secrets).
  secrets: []
  # Where those Secrets are (Lumovi may list Secrets there); this release's namespace unless
  # set.
  secretNamespaces: []
  # A Secret with the agents that may connect under `agents.yaml`: a list of
  # { name, tokenSha256, labels, groups, caSha256 }. caSha256 is the SHA-256 of the agent's
  # cluster's certificate authority (as `openssl x509 -fingerprint -sha256` says it, or a list
  # while it's rotated): the hub trusts no other the agent sends. Without it, the hub trusts
  # the one the agent first sends, and refuses another until an admin trusts it.
  agentsSecret: ''
  # Whether this cluster is one of the fleet's (as clusterName).
  includeThisCluster: true
  # Whether admins may add clusters on the Fleet page by pasting a kubeconfig or a token. Each is
  # kept as a Secret (labelled lumovi.dev/cluster) in a namespace of their own, addNamespace, the
  # only one where Lumovi may list, create and delete Secrets (never its own namespace). Off: the hub
  # holds no credentials it wasn't given here (connecting a cluster with its agent needs none).
  addFromPage: false
  # Where the clusters added on the Fleet page are kept: <release namespace>-clusters unless set.
  # Lumovi reads there only the Secrets it made (unless secrets and secretNamespaces name it):
  # someone else's, labelled lumovi.dev/cluster, aren't a cluster.
  addNamespace: ''
  # Whether the chart makes that namespace. It's kept when the release is uninstalled, with the
  # clusters in it (delete it to let them go); unset, it must exist.
  createAddNamespace: true
  # This cluster's labels in the fleet, like { env: production, region: eu-west }.
  labels: {}

# A fleet's agent (mode agent).
agent:
  # The fleet's Lumovi, like https://lumovi.example.com (https: the agent's token and its
  # cluster's go there).
  hubUrl: ''
  # A Secret with the agent's token under `token` (the hub knows its SHA-256). Unset, the chart
  # makes one, <release>-agent, that the agent keeps its token in: the one the hub gives it for
  # its joinToken (and only that Secret may it change).
  tokenSecret: ''
  # Connected from the Fleet page: its one-time join token, given from a file or stdin
  # (--set-file agent.joinToken=/dev/stdin), never on the command line. The agent exchanges it
  # for a token of its own, kept in its Secret, and the join token no longer works.
  joinToken: ''
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The address people open Lumovi at, like https://lumovi.example.com. Single sign-on
# needs it (the provider sends people back there); it also makes cookies HTTPS-only.
url: ''
# Where Lumovi is below that address, when it shares a host with other apps: /lumovi
basePath: /

auth:
  # How people sign in:
  # - token: with a token the cluster accepts (a service account's, say). Each person's
  #   requests carry their own token; Lumovi's own service account needs no permissions.
  # - oidc: single sign-on with an OpenID Connect provider (Dex, Keycloak, Okta, Entra ID,
  #   Google…). Lumovi impersonates whoever signs in, so their RBAC applies.
  # - proxy: behind an authenticating proxy (oauth2-proxy, Pomerium…) that names people in
  #   request headers. Lumovi impersonates them. Only safe when nothing but the proxy
  #   can reach Lumovi: networkPolicy.from must name the proxy's pods.
  mode: token

  oidc:
    # The provider's issuer URL, where /.well-known/openid-configuration is.
    issuer: ''
    clientId: ''
    # The client's secret (empty for public clients), or a Secret that has it under
    # client-secret.
    clientSecret: ''
    existingSecret: ''
    scopes: openid email profile
    # The ID token's claims that name people, and list their groups.
    usernameClaim: email
    groupsClaim: groups
    # On the sign-in button: "Sign in with Okta".
    providerName: ''
    # When the API server itself trusts the provider (its --oidc-* flags, a structured
    # authentication config, EKS's OIDC identity providers…): `id` or `access`, the
    # token requests carry instead of Lumovi impersonating people. Lumovi then
    # needs no permissions, and renews tokens with refresh tokens (ask for them:
    # offline_access, for most providers). Unset, it impersonates.
    forwardToken: ''

  proxy:
    userHeader: X-Forwarded-User
    groupsHeader: X-Forwarded-Groups
    # Where signing out of the proxy is, like https://lumovi.example.com/oauth2/sign_out
    signOutUrl: ''

  # Prefixed to impersonated users' and groups' names, like the API server's
  # --oidc-username-prefix: "oidc:" makes alice@example.com oidc:alice@example.com in RBAC.
  usernamePrefix: ''
  groupsPrefix: ''

  # How long a session lasts.
  sessionHours: 12
  # Sessions, the AI assistants people allowed, and what's set for each cluster (read-only,
  # say), kept in a Secret of the chart's, so a restart (an upgrade, say) signs nobody out and
  # changes nothing. No credential is kept as it is. false: in Lumovi's memory, so a restart
  # signs everyone out, and the clusters' settings start over.
  keepSessions: true
  # What they're sealed with, apart from them: the chart makes a Secret with a random key (and
  # keeps it). Where the chart is rendered with helm template (Argo CD), which can't keep it,
  # name a Secret of yours with at least 32 random characters under `key`.
  stateKeySecret: ''

# Nobody changes anything through Lumovi, whatever their RBAC allows.
readOnly: false

# AI assistants (Claude Code, Cursor, VS Code and other MCP clients) connect at <url>/mcp,
# signed in as someone through Lumovi (OAuth), and read the clusters that person can. Each
# person says in Lumovi what theirs may do, and where; what they say is kept in a ConfigMap the
# chart makes (<release>-assistant-rules), which uninstalling keeps.
assistants:
  enabled: true
  # Limits nobody's own AI permissions loosen. Each rule has a name; where it applies, as
  # clusters and namespaces (names, patterns like tenant-*, labels like team=payments, or "!"
  # first to leave one out; none: all of them); and what it limits: visibility (hidden),
  # changes (ask, never), secrets (keys, hidden), env (sensitive, all) or logs (off). A
  # cluster's labels are clusterLabels (in a fleet, its clusters'). Say:
  #   - name: System namespaces
  #     namespaces: [kube-*, cert-manager]
  #     visibility: hidden
  #   - name: Production
  #     clusters: [env=production]
  #     changes: ask
  #     secrets: keys
  rules: []
  # Changes as 1.4 limited them (rules say more): ask or never everywhere, unless set
  # otherwise for a cluster by its name: { staging: allow, production: never }. Unset, people
  # choose.
  changes: ''
  clusters: {}
  # Sites (host names) an assistant may send the person back to over https, after they allow
  # it. Assistants on their computer, and apps (Claude Code, Cursor, VS Code), need none.
  redirectHosts: []

metrics:
  # Where usage history comes from: auto (Lumovi looks for Prometheus or VictoriaMetrics),
  # off, or a service: monitoring/prometheus-operated:9090 (with a path after the port for
  # vmselect: vm/vmselect:8481/select/0/prometheus). Each person can choose another.
  source: auto
  # Where a cluster has no usage history, Lumovi offers its admins (LUMOVI_ADMINS; anyone where
  # it has none) to install a small metrics stack: Prometheus and kube-state-metrics, from a
  # chart it ships, in a namespace of its own (lumovi-metrics), as whoever installs it, so their
  # RBAC decides. false: it's never offered, installed or removed by Lumovi.
  stack: true

# Shells on nodes (a node's Shell tab): Lumovi starts a privileged pod on the node, as
# whoever asks, so their RBAC and the namespace's Pod Security decide, and deletes it when the
# shell ends. Each person can choose another namespace and image for themselves.
nodeShell:
  enabled: true
  # Where the pods are created: its Pod Security must allow privileged pods.
  namespace: kube-system
  # With a shell, and nsenter for shells on the node itself: a copy in your own registry where
  # nodes can't pull from Docker Hub.
  image: alpine:3.22

helm:
  # Lumovi fetches charts only from public addresses unless this allows private ones
  # (a ChartMuseum or Harbor in your network).
  allowPrivateCharts: false
  # Where Lumovi searches for charts.
  artifactHubUrl: https://artifacthub.io

# Views everyone sees, by file name: see https://docs.lumovi.dev/server/views.
#   views:
#     team.yaml: |
#       apiVersion: lumovi.dev/v1alpha1
#       kind: View
#       ...
views: {}

serviceAccount:
  create: true
  # The chart's fullname unless set.
  name: ''
  annotations: {}

# The audit log: what was done through Lumovi (changes, shells, port-forwards, logs and
# Secrets read, sign-ins, what AI assistants do and how their changes were approved), by whom,
# from where, and how it went. Events are chained (each holds the hash of the one before it),
# so a change to the history shows. See https://docs.lumovi.dev/server/audit-log.
audit:
  # changes: changes, sign-ins and settings. access: those, and what's opened and read too
  # (shells, port-forwards, logs, Secrets' values, and each tool an AI assistant calls).
  level: access
  # Who sees everyone's events on the Audit page (everyone else sees their own): groups, as
  # the sign-in names them, and people as user:<name>. Say [platform-admins, user:ana@example.com].
  auditors: []
  # Each event as a JSON line on Lumovi's output (with "type":"lumovi.audit"), for whatever
  # collects the cluster's logs: Fluent Bit, Vector, the Datadog or Splunk agent…
  stdout: true
  # The history the Audit page searches, on a volume that uninstalling keeps. Off, it's in
  # memory: what happened since Lumovi started. It's one chain, kept by one replica: with it
  # on, upgrades stop the old pod before the new one starts, and a second pod using the same
  # volume (scaled by hand, or by an autoscaler) doesn't start. The pod's fsGroup
  # (podSecurityContext) must be one that may write to it.
  persistence:
    enabled: true
    size: 2Gi
    # The cluster's default storage class unless set (a cluster without one needs it set);
    # '' for none (a volume made by hand, with no class).
    storageClass: null
    # A claim of your own, instead of the chart's.
    existingClaim: ''
  # How long the history keeps events, in days (the log collector or webhook keeps its own).
  retentionDays: 90
  # Each event sent to a webhook as well (a SIEM, Vector, Logstash, Cribl…), in batches, tried
  # again until it takes them.
  webhook:
    url: ''
    # json: an array of events a request; ndjson: a JSON line each.
    format: json
    # A Secret of yours with the headers to send, as YAML under headers.yaml:
    #   Authorization: Bearer …
    headersSecret: ''

# Who may do what through Lumovi, beyond what Kubernetes RBAC says (never more than it does):
# Lumovi's Admin pages, for the admins named here. None: everyone may do all their RBAC
# allows, as before. https://docs.lumovi.dev/server/access
access:
  # Who administers access in Lumovi: groups, as the sign-in names them, and people as
  # user:<name>. Say [platform-admins, user:ana@example.com].
  admins: []
  # What the chart says, which admins see in Lumovi but change only here: what everyone gets,
  # groups, profiles, grants, limits, and names for the provider's groups. What admins set in
  # Lumovi is kept in a ConfigMap that upgrades and uninstalling leave be. Say:
  #   everyone: { changes: read, shells: 'off', nodeShells: 'off', logs: 'on', secrets: keys,
  #               helm: 'off', assistants: ask, audit: own }
  #   groups:
  #     - id: platform
  #       name: Platform team
  #       provider: [platform-admins]
  #   profiles:
  #     - id: platform
  #       name: Platform
  #       values: { changes: write, shells: 'on', nodeShells: 'on', logs: 'on', secrets: values,
  #                 helm: install, assistants: self, audit: all }
  #   grants:
  #     - id: platform
  #       name: The platform team runs everything
  #       who: [platform]
  #       profile: platform
  #   limits:
  #     - id: production
  #       name: Production
  #       clusters: [env=production]
  #       caps: { nodeShells: 'off', helm: upgrade }
  policy: {}

rbac:
  # With oidc or proxy, Lumovi's service account may impersonate users and groups:
  # whoever can reach Lumovi's pod can act as anyone. Keep it in a namespace only cluster
  # admins can exec into, and use auth.usernamePrefix and auth.groupsPrefix.
  create: true

# Each replica knows the sessions it started (they're kept for a restart, not shared as they
# change): more than one needs sticky sessions, AI assistants off (their requests carry no
# cookies to stick to one replica), and the audit history off its volume
# (audit.persistence.enabled false: it's one chain, kept by one replica).
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ''
  annotations: {}
  # Lumovi's WebSocket stays open: give the ingress controller a long read timeout,
  # like nginx.ingress.kubernetes.io/proxy-read-timeout: "3600".
  hosts:
    - lumovi.example.com
  tls: []
  #  - secretName: lumovi-tls
  #    hosts: [lumovi.example.com]

# A company's network: Lumovi's own connections (single sign-on, Helm repositories, the audit
# webhook, an agent's to its hub, clusters its kubeconfig gives no proxy-url) go through this
# proxy, as kubectl's do. This cluster's API server and services are always reached directly.
proxy:
  https: ''
  http: ''
  # Or a Secret of yours with them, under HTTPS_PROXY (and HTTP_PROXY, if plain http goes
  # through one): for a proxy that wants credentials (http://user:password@proxy:3128), which
  # then aren't in the Deployment.
  secret: ''
  # Never through it: names (and what's under them, .corp.example.com) and addresses, each
  # with a port or for any; not ranges (CIDR).
  noProxy: ''

# Certificate authorities to trust besides the image's and the system's: a proxy that inspects
# HTTPS signs with its own. A ConfigMap or Secret of yours with them as PEM, under `key`.
extraCA:
  configMap: ''
  secret: ''
  key: ca.crt

# OpenShift gives each pod its user, group and fsGroup from the namespace's ranges: there, the
# podSecurityContext below is used without them. auto: where the cluster is OpenShift.
openshift: auto

networkPolicy:
  # Only lets in what `from` allows. With auth.mode proxy it's always on, and `from` must
  # name the proxy's pods (with a namespaceSelector, where it runs in another namespace):
  # Lumovi trusts the proxy's headers from whoever reaches it, so nobody else may. It
  # needs a network plugin that enforces NetworkPolicies (most do; flannel alone doesn't).
  enabled: false
  from: []
  #  - podSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: oauth2-proxy
  #    namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: oauth2-proxy

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# More environment variables, as a container's env (see
# https://docs.lumovi.dev/server/configuration).
extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ''
