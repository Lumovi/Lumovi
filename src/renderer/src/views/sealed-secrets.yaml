# Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets): secrets encrypted for the
# cluster's controller, which unseals each into a Secret of the same name.
apiVersion: kubestacks.dev/v1alpha1
kind: AddOn
metadata:
  name: sealed-secrets
spec:
  label: Sealed Secrets
  icon: lock
  category: config
  kinds:
    - { group: bitnami.com, kind: SealedSecret }
---
apiVersion: kubestacks.dev/v1alpha1
kind: View
metadata:
  name: sealed-secrets
spec:
  kinds:
    - { group: bitnami.com, kind: SealedSecret }
  icon: lock
  columns:
    - { name: Keys, path: .spec.encryptedData.*, type: count }
    - { name: Type, path: .spec.template.type, default: Opaque }
  status:
    - when: { path: '.status.conditions[?(@.type=="Synced")].status', equals: 'True' }
      health: healthy
      label: Unsealed
    - when: { path: '.status.conditions[?(@.type=="Synced")].status', equals: 'False' }
      health: critical
      label: Can’t unseal
      detail: '{{ .status.conditions[?(@.type=="Synced")].message }}'
    - health: progressing
      label: Waiting for the controller
  details:
    - { name: Type, path: .spec.template.type, default: Opaque }
    - { name: Immutable, path: .spec.template.immutable, type: boolean, default: 'No' }
  links:
    - name: Secret
      kind: Secret
      objectName: '{{ .metadata.name }}'
