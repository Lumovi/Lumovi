# Kubernetes' own kinds that have no page of their own.
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: kinds-of-kubernetes
spec:
  version: 1.0.0
  needs:
    lumovi: 1.22.0
  views:
    - name: custom-resource-definitions
      kinds:
        - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
      icon: puzzle
      columns:
        - { name: Kind, path: .spec.names.kind }
        - { name: Group, path: .spec.group }
        - { name: Scope, path: .spec.scope }
        - { name: Versions, path: '.spec.versions[*].name' }
      details:
        - { name: Kind, path: .spec.names.kind }
        - { name: Plural, path: .spec.names.plural }
        - { name: Short names, path: '.spec.names.shortNames[*]' }
        - { name: Stored versions, path: '.status.storedVersions[*]' }
